module_id: "claude-chat"
title: "Claude Chat"
version: "0.2"
language: "en"
recommended_duration_minutes: 45
passing_score: 80
question_bank_size: 15
questions_to_serve: 10
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "chat-q01"
    type: "multiple_choice"
    prompt: "Which task is the best fit for Claude Chat?"
    options:
      - key: "A"
        text: "Autonomously editing many files across your desktop while you are away."
      - key: "B"
        text: "Discussing a problem, drafting text, and iterating turn by turn."
      - key: "C"
        text: "Deploying code to production without human review."
      - key: "D"
        text: "Publishing external Sandvik-branded design assets without approval."
  - id: "chat-q02"
    type: "multiple_choice"
    prompt: "In this module, what does agentic AI usually mean in practical terms?"
    options:
      - key: "A"
        text: "Claude is always fully autonomous and no longer needs user review."
      - key: "B"
        text: "Claude may follow a multi-step flow, sometimes using tools and returned context."
      - key: "C"
        text: "Claude only answers from its original training data."
      - key: "D"
        text: "Claude can ignore Sandvik policy if a tool is available."
  - id: "chat-q03"
    type: "multiple_choice"
    prompt: "What makes a Claude Chat prompt stronger?"
    options:
      - key: "A"
        text: "It only says make this better."
      - key: "B"
        text: "It includes goal, context, constraints, output format, and checks."
      - key: "C"
        text: "It asks Claude to decide all policies on its own."
      - key: "D"
        text: "It hides the audience and purpose."
  - id: "chat-q04"
    type: "multiple_choice"
    prompt: "Where can relevant paid or seat-based Claude users usually check five-hour session and weekly usage progress?"
    options:
      - key: "A"
        text: "Settings > Usage, if available for their plan and organization."
      - key: "B"
        text: "Only by asking Claude to guess the remaining limit."
      - key: "C"
        text: "In every generated artifact."
      - key: "D"
        text: "In the source document being summarized."
  - id: "chat-q05"
    type: "multiple_choice"
    prompt: "What should a Sandvik user do if they hit a Claude usage limit during business work?"
    options:
      - key: "A"
        text: "Move the work to a private account to continue immediately."
      - key: "B"
        text: "Wait for the reset or use the approved Sandvik path to request more capacity."
      - key: "C"
        text: "Paste less accurate information so the task uses fewer tokens."
      - key: "D"
        text: "Ask a colleague to use their account for the same work."
  - id: "chat-q06"
    type: "multiple_choice"
    prompt: "Which activity can use more of a Claude usage limit?"
    options:
      - key: "A"
        text: "Long conversations, large files, tool use, connectors, or higher effort settings."
      - key: "B"
        text: "Only clicking the Send button."
      - key: "C"
        text: "Only messages that include more than one question mark."
      - key: "D"
        text: "Only chats that mention Sandvik."
  - id: "chat-q07"
    type: "multiple_choice"
    prompt: "How should users treat connectors in Claude Chat?"
    options:
      - key: "A"
        text: "Use any connector if it appears in the interface."
      - key: "B"
        text: "Use only approved connectors and review what Claude can access or do."
      - key: "C"
        text: "Turn on all connectors to improve every answer."
      - key: "D"
        text: "Assume connector permissions replace Sandvik policy."
  - id: "chat-q08"
    type: "multiple_choice"
    prompt: "What does it mean that a connector uses the user's permissions?"
    options:
      - key: "A"
        text: "Claude should only access what the connected user can already access in that service."
      - key: "B"
        text: "Claude gets administrator access to all company systems."
      - key: "C"
        text: "Sensitive data rules no longer apply."
      - key: "D"
        text: "Every colleague can see the same connector results."
  - id: "chat-q09"
    type: "multiple_choice"
    prompt: "What is a Claude skill?"
    options:
      - key: "A"
        text: "A reusable package of instructions, scripts, and resources Claude can load for a task."
      - key: "B"
        text: "A guarantee that Claude's output is approved and correct."
      - key: "C"
        text: "Only a saved one-line prompt."
      - key: "D"
        text: "A way to bypass project and connector permissions."
  - id: "chat-q10"
    type: "multiple_choice"
    prompt: "What is a Claude project useful for?"
    options:
      - key: "A"
        text: "Creating a focused workspace with related chats, knowledge, and instructions."
      - key: "B"
        text: "Making any uploaded information safe automatically."
      - key: "C"
        text: "Removing the need to verify outputs."
      - key: "D"
        text: "Giving every Sandvik user access to the same files."
  - id: "chat-q11"
    type: "multiple_choice"
    prompt: "You want to upload a file that may contain sensitive personal data. What should you do first?"
    options:
      - key: "A"
        text: "Upload it and ask Claude whether it was sensitive."
      - key: "B"
        text: "Remove the names only and continue."
      - key: "C"
        text: "Check Sandvik policy and use only approved, minimized information."
      - key: "D"
        text: "Move it into a project so it becomes safe."
  - id: "chat-q12"
    type: "multiple_choice"
    prompt: "If you ask Claude to summarize a document, which instruction reduces invented content?"
    options:
      - key: "A"
        text: "Use only the document and label assumptions or missing information."
      - key: "B"
        text: "Add helpful market context from memory."
      - key: "C"
        text: "Fill gaps with likely answers."
      - key: "D"
        text: "Make it sound complete even if information is missing."
  - id: "chat-q13"
    type: "multiple_choice"
    prompt: "What is a key risk when sharing a Claude artifact?"
    options:
      - key: "A"
        text: "Artifacts can never be edited."
      - key: "B"
        text: "The artifact or related context may expose information that needs review."
      - key: "C"
        text: "Artifacts are automatically approved by Brand."
      - key: "D"
        text: "Artifacts cannot contain code or diagrams."
  - id: "chat-q14"
    type: "multiple_choice"
    prompt: "When should a user consider Claude Code instead of Claude Chat?"
    options:
      - key: "A"
        text: "When the task requires repository inspection, code edits, tests, or development tooling."
      - key: "B"
        text: "When the task is a short email draft."
      - key: "C"
        text: "When the task is brainstorming meeting topics."
      - key: "D"
        text: "When the task is translating a paragraph."
  - id: "chat-q15"
    type: "multiple_choice"
    prompt: "What should you do if Claude's output seems useful but possibly incomplete?"
    options:
      - key: "A"
        text: "Ask for assumptions, missing facts, and what should be verified."
      - key: "B"
        text: "Treat it as final because it saved time."
      - key: "C"
        text: "Publish it and fix issues later."
      - key: "D"
        text: "Ask Claude to make it sound more confident."
answers:
  chat-q01: "B"
  chat-q02: "B"
  chat-q03: "B"
  chat-q04: "A"
  chat-q05: "B"
  chat-q06: "A"
  chat-q07: "B"
  chat-q08: "A"
  chat-q09: "A"
  chat-q10: "A"
  chat-q11: "C"
  chat-q12: "A"
  chat-q13: "B"
  chat-q14: "A"
  chat-q15: "A"
feedback:
  chat-q01:
    correct: "Correct. Chat is best for interactive, turn-by-turn work."
    incorrect: "Review when Chat is appropriate versus Cowork, Code, or Design."
  chat-q02:
    correct: "Correct. Agentic flows can involve multiple steps, tools, and returned context."
    incorrect: "Agentic does not remove user control, policy, or review."
  chat-q03:
    correct: "Correct. Clear prompts reduce rework and uncertainty."
    incorrect: "A strong prompt includes goal, context, constraints, output format, and checks."
  chat-q04:
    correct: "Correct. Usage visibility depends on plan and organization settings."
    incorrect: "Use the available usage settings rather than guessing."
  chat-q05:
    correct: "Correct. Follow the approved Sandvik path or wait for the reset."
    incorrect: "Do not work around limits using private accounts or unapproved access."
  chat-q06:
    correct: "Correct. More context, tools, and effort can consume more usage."
    incorrect: "Usage is affected by more than just the number of messages."
  chat-q07:
    correct: "Correct. Connectors require approval and careful access review."
    incorrect: "Connector availability does not override Sandvik policy."
  chat-q08:
    correct: "Correct. Connector access is scoped to the connected user's permissions."
    incorrect: "Per-user permissions do not grant universal or policy-free access."
  chat-q09:
    correct: "Correct. Skills help Claude apply repeatable workflows."
    incorrect: "A skill is more than a saved prompt and does not guarantee correctness."
  chat-q10:
    correct: "Correct. Projects organize related work and context."
    incorrect: "Projects do not make sensitive information automatically safe."
  chat-q11:
    correct: "Correct. Check policy and minimize data before using Claude."
    incorrect: "Sensitive data requires policy review and minimization before use."
  chat-q12:
    correct: "Correct. This limits invented content."
    incorrect: "Ask Claude to use the source and label uncertainty."
  chat-q13:
    correct: "Correct. Shared outputs can expose content that needs review."
    incorrect: "Artifacts are drafts and may contain sensitive or unapproved information."
  chat-q14:
    correct: "Correct. Codebase work belongs in Claude Code."
    incorrect: "Claude Code is for repository and development workflows."
  chat-q15:
    correct: "Correct. Ask for assumptions, gaps, and verification needs."
    incorrect: "Useful output still needs review when context may be incomplete."
