module_id: "claude-chat"
title: "Claude Chat"
version: "0.4"
language: "en"
recommended_duration_minutes: 45
passing_score: 80
question_bank_size: 15
questions_to_serve: 10
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "chat-q01"
    type: "multiple_choice"
    prompt: "Which task is the best fit for Claude Chat?"
    options:
      - key: "A"
        text: "Discussing a problem, drafting text, analyzing source material, and iterating turn by turn."
      - key: "B"
        text: "Autonomously editing many desktop files while you are away."
      - key: "C"
        text: "Deploying code to production without human review."
      - key: "D"
        text: "Publishing external Sandvik-branded design assets without approval."
  - id: "chat-q02"
    type: "multiple_choice"
    prompt: "In this module, what is the clearest difference between an agent and agentic chat?"
    options:
      - key: "A"
        text: "An agent is any answer Claude gives in one message; agentic chat means no tools are used."
      - key: "B"
        text: "An agent removes the need for Sandvik governance; agentic chat removes the need for review."
      - key: "C"
        text: "An agent is a built, reusable tool with instructions and data sources; agentic chat is Claude working through steps in a conversation, sometimes with approved tools or connectors."
      - key: "D"
        text: "There is no difference, so the terms should always be used interchangeably."
  - id: "chat-q03"
    type: "multiple_choice"
    prompt: "What makes a Claude Chat request stronger?"
    options:
      - key: "A"
        text: "It includes context, boundaries, output instructions, and review points."
      - key: "B"
        text: "It only says make this better."
      - key: "C"
        text: "It asks Claude to decide all Sandvik policies on its own."
      - key: "D"
        text: "It hides the audience and source material."
  - id: "chat-q04"
    type: "multiple_choice"
    prompt: "You want to use a connector while preparing a steering-group update. What is the safest approach?"
    options:
      - key: "A"
        text: "Turn on every connector so Claude has as much context as possible."
      - key: "B"
        text: "Use only an approved connector, keep the request narrow, review what Claude can access or do, and verify the returned source context."
      - key: "C"
        text: "Assume connector permissions replace Sandvik policy."
      - key: "D"
        text: "Let Claude create, send, update, or delete records without review."
  - id: "chat-q05"
    type: "multiple_choice"
    prompt: "What should a Sandvik user do if they hit a Claude usage limit during business work?"
    options:
      - key: "A"
        text: "Move the work to a private account to continue immediately."
      - key: "B"
        text: "Ask a colleague to use their account for the same work."
      - key: "C"
        text: "Paste less accurate information so the task uses fewer tokens."
      - key: "D"
        text: "Wait for the reset, reduce unnecessary context or tool use, or use the intranet form to request a higher monthly usage or spending limit with cost-approver approval."
  - id: "chat-q06"
    type: "multiple_choice"
    prompt: "Which activity can use more of a Claude usage limit?"
    options:
      - key: "A"
        text: "Long conversations, large files, project materials, artifacts, tool use, connectors, or higher effort settings."
      - key: "B"
        text: "Only clicking the Send button."
      - key: "C"
        text: "Only chats that mention Sandvik."
      - key: "D"
        text: "Only messages that include more than one question mark."
  - id: "chat-q07"
    type: "multiple_choice"
    prompt: "What does it mean that a connector uses the user's permissions?"
    options:
      - key: "A"
        text: "Claude gets administrator access to all company systems."
      - key: "B"
        text: "Sensitive data rules no longer apply."
      - key: "C"
        text: "Every colleague can see the same connector results."
      - key: "D"
        text: "Claude should only access what the connected user can already access in that service."
  - id: "chat-q08"
    type: "multiple_choice"
    prompt: "You want to upload a file that may contain sensitive personal data. What should you do first?"
    options:
      - key: "A"
        text: "Check Sandvik policy and use only approved, minimized information."
      - key: "B"
        text: "Upload it and ask Claude whether it was sensitive."
      - key: "C"
        text: "Move it into a project so it becomes safe."
      - key: "D"
        text: "Remove names only and continue without further review."
  - id: "chat-q09"
    type: "multiple_choice"
    prompt: "What is a Claude project useful for?"
    options:
      - key: "A"
        text: "Making any uploaded information safe automatically."
      - key: "B"
        text: "Removing the need to verify outputs."
      - key: "C"
        text: "Creating a focused workspace with related chats, approved knowledge, and project instructions."
      - key: "D"
        text: "Giving every Sandvik user access to the same files."
  - id: "chat-q10"
    type: "multiple_choice"
    prompt: "What is a Claude skill?"
    options:
      - key: "A"
        text: "A guarantee that Claude's output is approved and correct."
      - key: "B"
        text: "Only a saved one-line prompt."
      - key: "C"
        text: "A way to bypass project and connector permissions."
      - key: "D"
        text: "A reusable package of instructions, scripts, and resources Claude can load for a task."
  - id: "chat-q11"
    type: "multiple_choice"
    prompt: "What is a key risk when sharing a Claude artifact?"
    options:
      - key: "A"
        text: "The artifact or related conversation context, attachments, links, or source material may expose information that needs review."
      - key: "B"
        text: "Artifacts can never be edited."
      - key: "C"
        text: "Artifacts are automatically approved by Brand."
      - key: "D"
        text: "Artifacts cannot contain tables, diagrams, or code snippets."
  - id: "chat-q12"
    type: "multiple_choice"
    prompt: "When should a user consider Claude Code instead of Claude Chat?"
    options:
      - key: "A"
        text: "When the task is a short email draft."
      - key: "B"
        text: "When the task requires repository inspection, code edits, tests, or development tooling."
      - key: "C"
        text: "When the task is translating a paragraph."
      - key: "D"
        text: "When the task is brainstorming meeting topics."
  - id: "chat-q13"
    type: "multiple_choice"
    prompt: "What should you do if Claude's output seems useful but may be incomplete?"
    options:
      - key: "A"
        text: "Treat it as final because it saved time."
      - key: "B"
        text: "Publish it and fix issues later."
      - key: "C"
        text: "Ask for assumptions, missing facts, uncertainties, and what should be verified against the source."
      - key: "D"
        text: "Ask Claude to make it sound more confident."
  - id: "chat-q14"
    type: "multiple_choice"
    prompt: "Which prompt is closest to a useful specification for a steering-group update?"
    options:
      - key: "A"
        text: "Write a one-page steering-group update using only the attached notes; include progress, decisions, risks, assumptions, and mark missing facts as [CHECK REQUIRED]."
      - key: "B"
        text: "Write an update."
      - key: "C"
        text: "Make this sound better."
      - key: "D"
        text: "Create something impressive from all available context."
  - id: "chat-q15"
    type: "multiple_choice"
    prompt: "What is the best final gate before using Claude output in business communication or decisions?"
    options:
      - key: "A"
        text: "A more confident writing style."
      - key: "B"
        text: "Human review against the source material, policy requirements, and any subject-matter expertise needed."
      - key: "C"
        text: "A project workspace, because projects make all outputs approved."
      - key: "D"
        text: "A connector result, because connector output never needs checking."
answers:
  chat-q01: "A"
  chat-q02: "C"
  chat-q03: "A"
  chat-q04: "B"
  chat-q05: "D"
  chat-q06: "A"
  chat-q07: "D"
  chat-q08: "A"
  chat-q09: "C"
  chat-q10: "D"
  chat-q11: "A"
  chat-q12: "B"
  chat-q13: "C"
  chat-q14: "A"
  chat-q15: "B"
feedback:
  chat-q01:
    correct: "Correct. Chat is best for interactive, turn-by-turn thinking, drafting, and analysis."
    incorrect: "Review when Chat is appropriate versus Cowork, Code, Design, or another approved tool."
  chat-q02:
    correct: "Correct. Agent is the built reusable thing; agentic chat is the multi-step behavior inside a conversation."
    incorrect: "Do not use agent and agentic chat interchangeably in this module."
  chat-q03:
    correct: "Correct. Context, boundaries, output instructions, and review points make the request easier to steer and verify."
    incorrect: "A strong Claude Chat request should not leave audience, source material, output, or review needs implicit."
  chat-q04:
    correct: "Correct. Connector use should be approved, narrow, permission-aware, and reviewed."
    incorrect: "Connector availability does not override Sandvik policy or human review."
  chat-q05:
    correct: "Correct. Use the approved limit-reset, scope-reduction, or intranet request path."
    incorrect: "Do not work around limits using private accounts, colleague accounts, or unapproved access."
  chat-q06:
    correct: "Correct. More context, tools, artifacts, and higher effort settings can consume more usage."
    incorrect: "Usage is affected by more than just the number of messages."
  chat-q07:
    correct: "Correct. Connector access should be scoped to the connected user's permissions."
    incorrect: "Per-user permissions do not grant universal or policy-free access."
  chat-q08:
    correct: "Correct. Check policy and minimize data before using Claude."
    incorrect: "Sensitive data requires policy review and minimization before use."
  chat-q09:
    correct: "Correct. Projects organize related work, approved knowledge, and instructions."
    incorrect: "Projects do not make sensitive information automatically safe or approved."
  chat-q10:
    correct: "Correct. Skills help Claude apply repeatable workflows."
    incorrect: "A skill is more than a saved prompt and does not guarantee correctness."
  chat-q11:
    correct: "Correct. Shared outputs can expose content that needs review."
    incorrect: "Artifacts are drafts and may contain sensitive or unapproved information."
  chat-q12:
    correct: "Correct. Codebase work belongs in Claude Code."
    incorrect: "Claude Code is for repository and development workflows."
  chat-q13:
    correct: "Correct. Useful output still needs assumptions, gaps, uncertainties, and source checks."
    incorrect: "Do not turn uncertainty into confidence without verification."
  chat-q14:
    correct: "Correct. A useful specification defines source boundaries, output, required content, and checks."
    incorrect: "Move from a vague request to a clear specification."
  chat-q15:
    correct: "Correct. Humans remain accountable for business communication and decisions."
    incorrect: "Neither polished wording, projects, nor connectors replace human review."
