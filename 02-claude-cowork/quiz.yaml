module_id: "claude-cowork"
title: "Claude Cowork"
version: "0.1"
language: "en"
recommended_duration_minutes: 30
passing_score: 80
question_bank_size: 15
questions_to_serve: 8
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "cowork-q01"
    type: "multiple_choice"
    prompt: "Which task is the best fit for Claude Cowork?"
    options:
      - key: "A"
        text: "A one-sentence translation."
      - key: "B"
        text: "A clear deliverable that spans multiple files, tools, or browser steps."
      - key: "C"
        text: "A production deployment with no human approval."
      - key: "D"
        text: "A casual brainstorming chat with no output needed."
  - id: "cowork-q02"
    type: "multiple_choice"
    prompt: "What should a Cowork delegation prompt include?"
    options:
      - key: "A"
        text: "Only the phrase handle this."
      - key: "B"
        text: "Goal, context folder, allowed sources, boundaries, output, pause points, and definition of done."
      - key: "C"
        text: "Permission to use all local folders."
      - key: "D"
        text: "A request to avoid asking questions."
  - id: "cowork-q03"
    type: "multiple_choice"
    prompt: "What is the safest folder-access approach?"
    options:
      - key: "A"
        text: "Grant access to the entire computer."
      - key: "B"
        text: "Use the smallest approved working folder needed for the task."
      - key: "C"
        text: "Use personal downloads because they are convenient."
      - key: "D"
        text: "Copy unrelated files into the folder so Claude has context."
  - id: "cowork-q04"
    type: "multiple_choice"
    prompt: "Cowork is about to submit a form in a logged-in browser. What should happen?"
    options:
      - key: "A"
        text: "Let it continue automatically."
      - key: "B"
        text: "Require human review and approval before submission."
      - key: "C"
        text: "Ask Cowork to hide the action from the summary."
      - key: "D"
        text: "Submit first and verify later."
  - id: "cowork-q05"
    type: "multiple_choice"
    prompt: "What should you do if a Cowork task starts moving in the wrong direction?"
    options:
      - key: "A"
        text: "Interrupt, redirect, or stop the task."
      - key: "B"
        text: "Wait until all files are changed."
      - key: "C"
        text: "Ignore the plan and review only at the end."
      - key: "D"
        text: "Start another task with the same vague prompt."
  - id: "cowork-q06"
    type: "multiple_choice"
    prompt: "Why does cost and usage awareness matter for Cowork?"
    options:
      - key: "A"
        text: "Cowork tasks may be longer, tool-heavy, repeated, and may create pay-as-you-go usage."
      - key: "B"
        text: "Cowork cannot use any tokens."
      - key: "C"
        text: "Cost never depends on scope."
      - key: "D"
        text: "Usage disappears if files are local."
  - id: "cowork-q07"
    type: "multiple_choice"
    prompt: "How should scheduled or recurring Cowork tasks be treated?"
    options:
      - key: "A"
        text: "Use them whenever a user wants."
      - key: "B"
        text: "Use them only if Sandvik policy and product settings allow them."
      - key: "C"
        text: "Use them for sensitive tasks because nobody is present."
      - key: "D"
        text: "Use them to bypass review."
  - id: "cowork-q08"
    type: "multiple_choice"
    prompt: "When is Claude Chat usually better than Cowork?"
    options:
      - key: "A"
        text: "When you want a quick conversation, draft, or small analysis."
      - key: "B"
        text: "When a task must operate a desktop app."
      - key: "C"
        text: "When many files need to be reorganized."
      - key: "D"
        text: "When a browser workflow needs approvals."
  - id: "cowork-q09"
    type: "multiple_choice"
    prompt: "What is true about local files in Cowork?"
    options:
      - key: "A"
        text: "Local access removes the need for sensitivity review."
      - key: "B"
        text: "Local files still require Sandvik policy, access, and data review."
      - key: "C"
        text: "All local files are automatically public."
      - key: "D"
        text: "Cowork can only read files, never write outputs."
  - id: "cowork-q10"
    type: "multiple_choice"
    prompt: "Which action should always be treated as consequential?"
    options:
      - key: "A"
        text: "Drafting a private outline."
      - key: "B"
        text: "Sending, submitting, deleting, or changing records in another system."
      - key: "C"
        text: "Listing assumptions."
      - key: "D"
        text: "Summarizing the task plan."
  - id: "cowork-q11"
    type: "multiple_choice"
    prompt: "What should happen before using a Cowork deliverable?"
    options:
      - key: "A"
        text: "Human review for accuracy, policy, and intended use."
      - key: "B"
        text: "Automatic external publication."
      - key: "C"
        text: "Deletion of all source files."
      - key: "D"
        text: "Skipping review because Cowork verifies itself."
  - id: "cowork-q12"
    type: "multiple_choice"
    prompt: "What is the main problem with a vague Cowork prompt?"
    options:
      - key: "A"
        text: "It may lead to wrong scope, unnecessary access, or unusable output."
      - key: "B"
        text: "It makes Cowork ask too few questions."
      - key: "C"
        text: "It prevents any file access."
      - key: "D"
        text: "It automatically improves security."
  - id: "cowork-q13"
    type: "multiple_choice"
    prompt: "What belongs in a good Cowork context folder?"
    options:
      - key: "A"
        text: "Approved source files, templates, instructions, and a clear output location."
      - key: "B"
        text: "Every related folder the user can access."
      - key: "C"
        text: "Unrelated personal files to give Claude more background."
      - key: "D"
        text: "Credentials so Claude can log in without asking."
  - id: "cowork-q14"
    type: "multiple_choice"
    prompt: "What is the safest way to handle work you repeat, before scheduled Cowork tasks are approved?"
    options:
      - key: "A"
        text: "Create a reusable manual brief and start each run yourself."
      - key: "B"
        text: "Ask Cowork to run automatically whenever it wants."
      - key: "C"
        text: "Remove all review points so the work is faster."
      - key: "D"
        text: "Use the broadest folder so the brief never needs updating."
  - id: "cowork-q15"
    type: "multiple_choice"
    prompt: "Which instruction best fits a one-off background Cowork task?"
    options:
      - key: "A"
        text: "Work on this approved folder, save the draft in the output folder, and pause before using browser or connector access."
      - key: "B"
        text: "Schedule this forever, even if Sandvik has not enabled recurring work."
      - key: "C"
        text: "Change any source files you find without showing a plan."
      - key: "D"
        text: "Use any local folder or system that might help."
answers:
  cowork-q01: "B"
  cowork-q02: "B"
  cowork-q03: "B"
  cowork-q04: "B"
  cowork-q05: "A"
  cowork-q06: "A"
  cowork-q07: "B"
  cowork-q08: "A"
  cowork-q09: "B"
  cowork-q10: "B"
  cowork-q11: "A"
  cowork-q12: "A"
  cowork-q13: "A"
  cowork-q14: "A"
  cowork-q15: "A"
feedback:
  cowork-q01:
    correct: "Correct. Cowork is for clear multi-step deliverables."
    incorrect: "Cowork is best when the work spans files, tools, browser, or desktop actions."
  cowork-q02:
    correct: "Correct. Cowork needs a clear brief, not just a loose request."
    incorrect: "Use a complete brief: goal, context, allowed sources, boundaries, output, pause points, and definition of done."
  cowork-q03:
    correct: "Correct. Narrow access reduces risk."
    incorrect: "Use the smallest approved folder, not broad local access."
  cowork-q04:
    correct: "Correct. Submitting in a logged-in browser needs human approval."
    incorrect: "Consequential browser actions need review before execution."
  cowork-q05:
    correct: "Correct. Users should stay in control."
    incorrect: "Interrupt or redirect when the task is no longer aligned."
  cowork-q06:
    correct: "Correct. Scope affects usage and can affect cost."
    incorrect: "Long or repeated tool-heavy tasks require usage and cost awareness."
  cowork-q07:
    correct: "Correct. Scheduled work requires explicit approval."
    incorrect: "Recurring tasks must follow Sandvik policy and settings."
  cowork-q08:
    correct: "Correct. Chat is better for quick interactive work."
    incorrect: "Use Cowork when delegation across files or tools is needed."
  cowork-q09:
    correct: "Correct. Local files still need policy review."
    incorrect: "Local access does not remove data or access obligations."
  cowork-q10:
    correct: "Correct. These actions can affect real systems."
    incorrect: "Consequential actions require review and approval."
  cowork-q11:
    correct: "Correct. Finished work still needs human review."
    incorrect: "Cowork output is not automatically approved."
  cowork-q12:
    correct: "Correct. Vague delegation increases risk and rework."
    incorrect: "A clear goal and constraints are essential for Cowork."
  cowork-q13:
    correct: "Correct. A context folder should be narrow, approved, and organized around the task."
    incorrect: "Use approved task-relevant sources, templates, instructions, and output expectations, not unrelated files or credentials."
  cowork-q14:
    correct: "Correct. A reusable manual brief is safer until scheduled work is approved."
    incorrect: "Repeated work still needs human control unless Sandvik has approved scheduled or recurring tasks."
  cowork-q15:
    correct: "Correct. One-off background work still needs narrow access, output expectations, and pause points."
    incorrect: "Background work is not permission to schedule, broaden access, or make consequential changes without review."
