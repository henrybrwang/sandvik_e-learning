<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat</title>
<script src="scorm.js"></script>
<style>
  :root {
    --page: #ffffff;
    --surface: #ffffff;
    --sidebar: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7077;
    --faint: #9aa0a6;
    --line: #e6e8ea;
    --line-soft: #f0f1f2;
    --accent: #111315;
    --active-bg: #f4f5f6;
    --success: #1f8a4c;
    --success-soft: #eaf6ee;
    --error: #c23434;
    --error-soft: #fbeaea;
    --warning-soft: #fff7e6;
    --warning-line: #e8c879;
    --focus: #0f67ff;
    --sidebar-w: 300px;
    --topbar-h: 56px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  button, input { font: inherit; }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    z-index: 30;
  }

  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .menu-btn {
    display: none;
    border: none;
    background: transparent;
    color: var(--ink);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.2rem;
    align-items: center;
    justify-content: center;
  }
  .menu-btn:hover { background: var(--active-bg); }

  /* Placeholder logo mark — swap for the approved Sandvik asset */
  .logo-mark {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 0.95rem;
    flex: none;
  }

  .topbar-course {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--active-bg);
    border: 1px solid var(--line);
    color: var(--muted);
    display: grid;
    place-items: center;
    font-size: 0.8rem;
    font-weight: 700;
    flex: none;
  }

  /* ---------- Shell ---------- */
  .shell {
    display: flex;
    padding-top: var(--topbar-h);
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex: none;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    position: fixed;
    top: var(--topbar-h);
    bottom: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-head { padding: 22px 22px 16px; border-bottom: 1px solid var(--line-soft); }

  .sidebar-title {
    margin: 0 0 14px;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.25;
  }

  .progress-label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }

  .progress-track {
    height: 5px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--ink);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .nav-list {
    list-style: none;
    margin: 0;
    padding: 8px 0 24px;
    overflow-y: auto;
    flex: 1;
  }

  .nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    text-align: left;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 11px 22px;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1.35;
    border-left: 3px solid transparent;
  }
  .nav-item:hover:not(:disabled) { background: var(--line-soft); color: var(--ink); }
  .nav-item:disabled { color: var(--faint); cursor: not-allowed; }

  .nav-item.active {
    color: var(--ink);
    font-weight: 600;
    background: var(--active-bg);
    border-left-color: var(--ink);
  }

  .nav-icon {
    width: 16px; height: 16px;
    flex: none;
    display: grid;
    place-items: center;
    color: var(--faint);
  }
  .nav-item.active .nav-icon { color: var(--ink); }
  .nav-item.done .nav-icon { color: var(--success); }

  .nav-divider {
    margin: 8px 22px;
    border-top: 1px solid var(--line-soft);
  }

  /* ---------- Main ---------- */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .content-scroll { flex: 1; }

  .content {
    max-width: 720px;
    margin: 0 auto;
    padding: 44px 32px 24px;
  }

  .wordmark {
    font-weight: 800;
    letter-spacing: 0.18em;
    font-size: 1.05rem;
    margin: 0 0 30px;
  }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 600;
  }

  .page-indicator {
    margin: 0 0 6px;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 600;
  }

  h1 {
    font-size: 1.9rem;
    line-height: 1.2;
    margin: 0 0 20px;
    font-weight: 800;
  }

  h2 { font-size: 1.2rem; margin: 28px 0 10px; font-weight: 700; }

  p { margin: 0 0 15px; }

  ul, ol { margin: 12px 0 18px 22px; padding: 0; }
  li { margin: 7px 0; }

  code {
    background: var(--line-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.9em;
  }

  pre {
    margin: 16px 0;
    padding: 16px 18px;
    overflow-x: auto;
    border-radius: 10px;
    background: #1b1f24;
    color: #e9eef2;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.88rem;
    line-height: 1.55;
  }

  .callout {
    border: 1px solid var(--warning-line);
    background: var(--warning-soft);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 20px 0;
  }
  .callout p:last-child { margin-bottom: 0; }

  /* Cover / lobby page */
  .cover .page-indicator,
  .cover .wordmark { }
  .cover-eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    margin: 0 0 12px;
  }
  .cover h1 { font-size: 2.4rem; margin-bottom: 16px; }
  .cover-lede { font-size: 1.12rem; color: #2c3036; max-width: 600px; }
  .cover-meta {
    list-style: none;
    margin: 22px 0 4px;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .cover-meta li {
    margin: 0;
    display: flex;
    gap: 8px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .cover-meta strong { color: var(--ink); font-weight: 600; min-width: 120px; }

  /* ---------- Footer nav ---------- */
  .footer-nav {
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 16px 32px;
  }
  .footer-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .btn-next {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    font-weight: 600;
    cursor: pointer;
    min-height: 46px;
  }
  .btn-next:hover:not(:disabled) { background: #33373c; }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-back {
    background: transparent;
    border: none;
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    padding: 10px 6px;
  }
  .btn-back:hover:not(:disabled) { color: var(--ink); }
  .btn-back:disabled { opacity: 0; cursor: default; pointer-events: none; }

  .nav-hint { color: var(--muted); font-size: 0.85rem; }

  /* ---------- Quiz ---------- */
  .quiz-options { display: grid; gap: 11px; margin-top: 20px; }
  .quiz-option {
    width: 100%;
    text-align: left;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    padding: 15px 16px;
    cursor: pointer;
    line-height: 1.45;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--ink); }
  .quiz-option.correct { border-color: var(--success); background: var(--success-soft); }
  .quiz-option.wrong { border-color: var(--error); background: var(--error-soft); }
  .quiz-option:disabled { cursor: default; }
  .quiz-option .opt-key { font-weight: 700; margin-right: 8px; }

  .feedback { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 10px; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--success-soft); color: #145c31; border: 1px solid #b9e2c6; }
  .feedback.wrong { background: var(--error-soft); color: #842323; border: 1px solid #ecc1c1; }

  /* ---------- Results ---------- */
  .score { font-size: 3.4rem; line-height: 1; font-weight: 800; margin: 16px 0 6px; }
  .score.pass { color: var(--success); }
  .score.fail { color: var(--error); }
  .score-bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 22px 0; }
  .score-seg { height: 9px; border-radius: 999px; background: var(--line); }
  .score-seg.ok { background: var(--success); }
  .score-seg.bad { background: var(--error); }
  .result-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .result-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .result-card h2 { margin: 0 0 6px; font-size: 1rem; }
  .result-card p { margin: 0 0 10px; color: var(--muted); font-size: 0.92rem; }
  .btn-secondary {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 9px 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary:hover { border-color: var(--ink); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .scrim {
    display: none;
    position: fixed;
    inset: var(--topbar-h) 0 0 0;
    background: rgba(0,0,0,0.35);
    z-index: 19;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .menu-btn { display: inline-flex; }
    .sidebar {
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      z-index: 20;
      box-shadow: 0 10px 40px rgba(0,0,0,0.18);
    }
    body.nav-open .sidebar { transform: translateX(0); }
    body.nav-open .scrim { display: block; }
    .main { margin-left: 0; }
    .content { padding: 30px 20px 20px; }
    .footer-nav { padding: 14px 20px; }
    h1 { font-size: 1.55rem; }
    .cover h1 { font-size: 1.9rem; }
    .result-cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" type="button" id="menuBtn" aria-label="Toggle course menu">&#9776;</button>
    <!-- Placeholder logo mark: replace with the approved Sandvik logo asset -->
    <div class="logo-mark" aria-hidden="true">C</div>
    <span class="topbar-course">Claude Chat</span>
  </div>
  <div class="avatar" id="moduleStatusBadge" title="Not completed" aria-label="Module status">&#8226;</div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Course contents">
    <div class="sidebar-head">
      <h2 class="sidebar-title">Claude Chat</h2>
      <p class="progress-label" id="progressLabel">You completed 0%</p>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <nav><ul class="nav-list" id="navList"></ul></nav>
  </aside>

  <main class="main">
    <div class="content-scroll">
      <div class="content" id="pageRoot" aria-live="polite"></div>
    </div>
    <div class="footer-nav">
      <div class="footer-inner">
        <button class="btn-back" type="button" id="prevBtn">&#8592; Back</button>
        <span class="nav-hint" id="navHint"></span>
        <button class="btn-next" type="button" id="nextBtn">Next</button>
      </div>
    </div>
  </main>
</div>

<script>
var COURSE = {
  "id": "claude-chat",
  "title": "Claude Chat",
  "passingScore": 80,
  "questionsToServe": 10,
  "pages": [
    {
      "cover": true,
      "nav": "Welcome",
      "section": "Welcome",
      "title": "Claude Chat",
      "body": [
        "<p class='cover-eyebrow'>Sandvik &middot; Claude Enterprise training</p>",
        "<h1>Claude Chat</h1>",
        "<p class='cover-lede'>Learn when to use Claude Chat, how to give it useful context, how approved tools and connectors extend a conversation, and how to work responsibly within Sandvik policy.</p>",
        "<ul class='cover-meta'><li><strong>Estimated time</strong> 35&ndash;45 minutes</li><li><strong>Completion</strong> Scored quiz (80% to pass)</li><li><strong>Audience</strong> Sandvik users ordering Claude Chat</li></ul>",
        "<div class='callout'><p>Claude can help accelerate work, but users remain responsible for what they enter, approve, share, and publish. Follow Sandvik policy, protect sensitive information, and review outputs before relying on them.</p></div>"
      ]
    },
    {
      "nav": "Overview &amp; audience",
      "section": "Overview and audience",
      "title": "Overview And Audience",
      "body": [
        "<p>Claude Chat is the conversational Claude experience. It is suitable for work where you ask questions, draft text, analyze information, summarize content, translate, brainstorm, compare options, or create reusable outputs such as documents and simpler visualizations.</p>",
        "<p>This module is for users who need Claude Chat as a daily work partner. It explains when Chat is the right Claude product, how to give it useful context, how approved tools and connectors can extend a conversation, how Claude-specific features such as files, connectors, projects, skills, and artifacts work, and how to review outputs before using them.</p>",
        "<p>Claude Chat is not the same as Claude Cowork, Claude Code, Claude Design, Microsoft 365 Copilot, GitHub Copilot, or a built agent in Copilot Agent Builder. If the work needs desktop actions, repository changes, visual design depth, or a reusable agent that is configured and shared, another tool may be a better fit.</p>"
      ]
    },
    {
      "nav": "What this module adds",
      "section": "Foundations",
      "title": "What This Module Adds",
      "body": [
        "<p>The AI Fluency foundation already covers the general rules of safe AI use: use approved tools, protect information, give useful context, iterate, and check confident answers before acting on them.</p>",
        "<p>It also introduces creating agents: small AI tools you set up for a recurring job. An agent has a role, instructions, and data sources. You build it once so it can be reused, and sometimes shared, under the right governance rules.</p>",
        "<p>Agents are useful because they do more than answer one prompt. They can follow steps, use available context or tools, bring information back, and continue from there. For example, a morning brief agent might check recent mail and meeting context, identify what needs attention, and summarize it for you. Think of it as prompts that take multiple turns to reach the answer.</p>",
        "<p>Claude uses the same ideas with heavy emphasis on connecting your chats to your relevant data sources and saving your ways of working. This is done by customizations in the form of connectors and skills. Claude can use them during the chat to gather context and continue the task. That is what this module means by agentic or tool-assisted chat: not a separate agent you have built, but Claude working through multiple steps inside the conversation.</p>"
      ]
    },
    {
      "nav": "Learning objectives",
      "section": "Learning objectives",
      "title": "Learning Objectives",
      "body": [
        "<p>After this module, you should be able to:</p>",
        "<ul><li>Decide when Claude Chat is the right product, and when another Claude or Sandvik-approved tool is a better fit.</li><li>Give Claude useful context, boundaries, output instructions, and review points.</li><li>Explain the difference between a built agent and agentic or tool-assisted chat.</li><li>Use files, connectors, projects, skills, and artifacts responsibly where approved.</li><li>Manage usage and cost by scoping context, tool use, and long conversations deliberately.</li><li>Verify and share outputs safely, with Sandvik policy and human accountability in mind.</li></ul>"
      ]
    },
    {
      "nav": "When to use Claude Chat",
      "section": "Choosing the tool",
      "title": "When To Use Claude Chat",
      "body": [
        "<p>Use Claude Chat when:</p>",
        "<ul><li>You are still thinking through a problem and want an interactive thought partner.</li><li>You need a first draft, summary, translation, comparison, checklist, or structured analysis.</li><li>The task is small enough to steer through a conversation.</li><li>You want to upload or paste selected context and ask questions about it.</li><li>You want text or an artifact you can inspect, edit, and reuse.</li><li>You want Claude to use approved chat tools or connectors as part of a controlled conversation.</li></ul>",
        "<p>Use a different product or tool when:</p>",
        "<ul><li>The work is a clear deliverable that spans many files, browser steps, desktop files, or desktop actions: consider Claude Cowork.</li><li>The work requires reading and changing a codebase, running tests, or using development tools: consider Claude Code.</li><li>The main output is visual exploration, prototypes, slides, or design concepts: consider Claude Design.</li></ul>"
      ]
    },
    {
      "nav": "The core workflow",
      "section": "Core workflow",
      "title": "The Core Workflow: Context, Boundaries, Output, Review",
      "body": [
        "<p>Claude Chat becomes useful when it understands the work problem, not just the immediate wording of your request. The foundation prompt habits still apply, but in this module they serve one practical workflow:</p>",
        "<ol><li>Give context: what the work is about, who it is for, and what source material Claude may use.</li><li>Set boundaries: what Claude must not assume, access, include, or decide.</li><li>Define the output: format, length, tone, audience, and required sections.</li><li>Build in review: ask Claude to flag missing facts, assumptions, uncertainty, and items that need human or policy review.</li></ol>",
        "<p>For example, this is vague:</p>",
        "<pre>Make this update better.</pre>",
        "<p>This is more useful:</p>",
        "<pre>Rewrite the attached project update for a Sandvik steering group.\nUse only the attached notes.\nKeep it to one page.\nInclude progress, decisions needed, risks, assumptions, and open questions.\nIf the text may be used externally, flag anything that needs Legal, Brand, or Data Protection review.</pre>"
      ]
    },
    {
      "nav": "Agents &amp; agentic chat",
      "section": "Agentic chat",
      "title": "Agents, Agentic Chat, And Tool Use",
      "body": [
        "<p>Claude works mainly through an agentic multi-step flow where it can plan, use approved tools, bring new context back into the chat, and adapt based on what it finds.</p>",
        "<p>A simple tool-assisted chat flow looks like this:</p>",
        "<ol><li>You ask Claude to prepare a daily summary from your emails.</li><li>Claude identifies that context from your email inbox is required to fulfill your request.</li><li>If an approved email connector is available, Claude uses it to access only your permitted email data.</li><li>The connector returns content strictly limited to your permissions and the connector&rsquo;s allowed actions.</li><li>Claude uses the returned email context to draft the daily summary.</li><li>You review the included sources, flagged assumptions, policy considerations, and the final summary before sharing or acting on it.</li></ol>",
        "<p>That is agentic chat: user goal, approved tool use, returned context, Claude output, and human review. You remain responsible for deciding whether the tool should be used, if the context is appropriate, and whether the output is reliable enough to act on.</p>"
      ]
    },
    {
      "nav": "The context stack",
      "section": "The Claude Chat context stack",
      "title": "The Claude Chat Context Stack",
      "body": [
        "<p>Claude Chat can use context in several different ways. Think of the features on the next pages as a context stack: each one changes what Claude can see, remember, retrieve, reuse, or produce.</p>",
        "<ul><li><strong>Files</strong> &mdash; context you attach.</li><li><strong>Connectors</strong> &mdash; context Claude retrieves.</li><li><strong>Projects</strong> &mdash; context you organize.</li><li><strong>Skills</strong> &mdash; reusable instructions and resources.</li></ul>"
      ]
    },
    {
      "nav": "1. Files",
      "section": "The Claude Chat context stack",
      "title": "Files: Context You Attach",
      "body": [
        "<p>Files let Claude work with material you provide, such as a policy draft, report, spreadsheet, meeting notes, or specification. Claude can summarize, compare, extract, rewrite, and answer questions about the content.</p>",
        "<p>Treat files as data. If a document, email, or webpage contains instructions that conflict with Sandvik policy or your actual goal, do not let those instructions override your intent. Give Claude clear instructions about which file matters most, what the file is, and what kind of output you need.</p>",
        "<p>Claude can work with long documents, including documents that are hundreds of pages, as long as the material fits within the available context and is organized enough to follow. More context is not always better. Large or messy uploads can make it harder for Claude to focus on the right evidence and can increase the risk of missed details or confident mistakes.</p>",
        "<p>For large files, tell Claude exactly what to look for, which sections matter most, and what it should ignore. For spreadsheets or datasets, treat Claude as a simpler reasoning and explanation assistant rather than a dedicated data-analysis system. It can help summarize, inspect, and explain patterns, but important calculations, formulas, row counts, and conclusions need to be checked against the original file or a proper analysis tool.</p>"
      ]
    },
    {
      "nav": "2. Connectors",
      "section": "The Claude Chat context stack",
      "title": "Connectors And Tool Access: Context Claude Retrieves",
      "body": [
        "<p>Connectors let Claude connect to approved apps and services. A connector may let Claude retrieve data, search a system, or in some cases take actions in that service.</p>",
        "<p>The practical idea is that connectors bring extra context into Claude Chat without you manually copying everything. Claude uses the connected service through your login and permissions. If you cannot access a file, channel, record, or repository through your own account in the source system, the connector cannot give Claude access to it either.</p>",
        "<p>Examples of using the Microsoft 365 connector (pending approval):</p>",
        "<ul><li>Find or summarize documents from SharePoint.</li><li>Get the last week&rsquo;s meeting transcripts and summarize action points.</li><li>Find available time slots for a meeting.</li></ul>",
        "<p>Other example use cases with Sandvik-approved connectors:</p>",
        "<ul><li>HubSpot (CRM system): get customer data and help analyse a sales pipeline.</li><li>GitHub (code repository): help understand a code base.</li></ul>",
        "<p>Good habits:</p>",
        "<ul><li>Understand what Claude is trying to access or do through connectors.</li><li>Prefer narrow access and specific prompts.</li><li>Pause before Claude drafts, sends, updates, creates, deletes, or changes anything in another system.</li><li>Watch for prompt injection in retrieved content, especially emails, documents, web pages, tickets, or repositories.</li></ul>"
      ]
    },
    {
      "nav": "3. Projects",
      "section": "The Claude Chat context stack",
      "title": "Projects: Context You Organize",
      "body": [

var storageKey = "lms_progress_" + COURSE.id;
var contentCount = COURSE.pages.length;
var resultsOffset = contentCount + COURSE.questionsToServe;
var state = {
  page: 0,
  maxVisited: 0,
  selectedQuestionIds: null,
  quizAnswers: {},
  completed: false
};
var savedAndFinished = false;

var pageRoot = document.getElementById("pageRoot");
var prevBtn = document.getElementById("prevBtn");
var nextBtn = document.getElementById("nextBtn");
var navHint = document.getElementById("navHint");
var navList = document.getElementById("navList");
var progressFill = document.getElementById("progressFill");
var progressLabel = document.getElementById("progressLabel");
var statusBadge = document.getElementById("moduleStatusBadge");
var menuBtn = document.getElementById("menuBtn");
var scrim = document.getElementById("scrim");

function shuffle(items) {
  var copy = items.slice();
  for (var i = copy.length - 1; i > 0; i -= 1) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

function selectQuestions() {
  return shuffle(COURSE.quizBank.map(function(q) { return q.id; })).slice(0, COURSE.questionsToServe);
}

function getQuestionById(id) {
  for (var i = 0; i < COURSE.quizBank.length; i += 1) {
    if (COURSE.quizBank[i].id === id) return COURSE.quizBank[i];
  }
  return null;
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : null;
  } catch (error) { return null; }
}

function saveLocal() {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (error) {}
}

function restoreState(saved) {
  if (!saved) return;
  if (typeof saved.page === "number") state.page = saved.page;
  if (typeof saved.maxVisited === "number") state.maxVisited = saved.maxVisited;
  if (Array.isArray(saved.selectedQuestionIds)) state.selectedQuestionIds = saved.selectedQuestionIds;
  if (saved.quizAnswers && typeof saved.quizAnswers === "object") state.quizAnswers = saved.quizAnswers;
  if (typeof saved.completed === "boolean") state.completed = saved.completed;
}

function persist() {
  SCORM.setPage(state.page);
  SCORM.saveSuspendData(state);
  saveLocal();
}

function ensureQuestions() {
  if (!Array.isArray(state.selectedQuestionIds) || state.selectedQuestionIds.length !== COURSE.questionsToServe) {
    state.selectedQuestionIds = selectQuestions();
    state.quizAnswers = {};
  }
}

function getTotalPages() { return contentCount + COURSE.questionsToServe + 1; }
function getCurrentQuestionIndex() { return state.page - contentCount; }
function isQuizPage() { return state.page >= contentCount && state.page < resultsOffset; }
function isResultsPage() { return state.page === resultsOffset; }

function allQuizAnswered() {
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    if (!state.quizAnswers[state.selectedQuestionIds[i]]) return false;
  }
  return true;
}

function answeredCurrentQuestion() {
  if (!isQuizPage()) return true;
  var qid = state.selectedQuestionIds[getCurrentQuestionIndex()];
  return Boolean(state.quizAnswers[qid]);
}

function escapeText(text) {
  var span = document.createElement("span");
  span.textContent = text;
  return span.innerHTML;
}

function renderContentPage(page) {
  var html = "";
  if (page.cover) {
    pageRoot.className = "content cover";
    html += page.body.join("");
  } else {
    pageRoot.className = "content";
    html += "<p class='wordmark'>SANDVIK</p>";
    html += "<p class='page-indicator'>Page " + (state.page + 1) + " of " + contentCount + "</p>";
    html += "<p class='eyebrow'>" + escapeText(page.section) + "</p>";
    html += "<h1>" + escapeText(page.title) + "</h1>";
    html += page.body.join("");
  }
  pageRoot.innerHTML = html;
}

function renderQuizPage(questionIndex) {
  pageRoot.className = "content";
  var qid = state.selectedQuestionIds[questionIndex];
  var question = getQuestionById(qid);
  var saved = state.quizAnswers[qid];
  var optionKeys = ["A", "B", "C", "D"];
  var html = "<p class='wordmark'>SANDVIK</p>";
  html += "<p class='page-indicator'>Knowledge check &middot; " + (questionIndex + 1) + " of " + COURSE.questionsToServe + "</p>";
  html += "<h1>" + escapeText(question.prompt) + "</h1>";
  html += "<p class='eyebrow'>Choose the best answer. Feedback appears immediately.</p>";
  html += "<div class='quiz-options' role='group' aria-label='Answer options'>";
  optionKeys.forEach(function(key) {
    var classes = "quiz-option";
    if (saved) {
      if (key === question.answer) classes += " correct";
      else if (key === saved.selected) classes += " wrong";
    }
    html += "<button class='" + classes + "' type='button' data-option='" + key + "'" + (saved ? " disabled" : "") + "><span class='opt-key'>" + key + ".</span>" + escapeText(question.options[key]) + "</button>";
  });
  html += "</div>";
  html += "<div class='feedback" + (saved ? " show " + (saved.correct ? "correct" : "wrong") : "") + "' id='feedbackBox'>" + (saved ? escapeText(saved.correct ? question.correct : question.incorrect) : "") + "</div>";
  pageRoot.innerHTML = html;

  var buttons = pageRoot.querySelectorAll(".quiz-option");
  for (var i = 0; i < buttons.length; i += 1) {
    buttons[i].addEventListener("click", function(event) {
      answerQuestion(question, event.currentTarget.getAttribute("data-option"));
    });
  }
}

function calculateScore() {
  var correctCount = 0;
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    if (answer && answer.correct) correctCount += 1;
  }
  return Math.round((correctCount / COURSE.questionsToServe) * 100);
}

function renderResultsPage() {
  pageRoot.className = "content";
  var score = calculateScore();
  var passed = score >= COURSE.passingScore;
  state.completed = passed;
  var html = "<p class='wordmark'>SANDVIK</p>";
  html += "<p class='page-indicator'>Results</p>";
  html += "<h1>Your results</h1>";
  html += "<div class='score " + (passed ? "pass" : "fail") + "'>" + score + "%</div>";
  html += "<p class='eyebrow'>" + (passed ? "Passed. You have met the 80% requirement for this module." : "Not yet passed. Review the module and retake the quiz when ready.") + "</p>";
  html += "<div class='score-bar' aria-label='Quiz result by question'>";
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    html += "<span class='score-seg " + (answer && answer.correct ? "ok" : "bad") + "'></span>";
  }
  html += "</div>";
  html += "<div class='result-cards'><div class='result-card'><h2>Completion</h2><p>If this course is running in an LMS, your score is sent when you reach this page.</p></div><div class='result-card'><h2>Next action</h2><p>You can retake the quiz as many times as you need.</p><button class='btn-secondary' type='button' id='retryBtn'>Retake quiz</button></div></div>";
  pageRoot.innerHTML = html;
  document.getElementById("retryBtn").addEventListener("click", retakeQuiz);
  SCORM.complete(score, passed);
  persist();
}

function buildNavModel() {
  var items = [];
  for (var i = 0; i < contentCount; i += 1) {
    items.push({ label: COURSE.pages[i].nav, page: i, type: "content" });

  items.push({ label: "Knowledge check", page: contentCount, type: "quiz" });
  items.push({ label: "Results", page: resultsOffset, type: "results" });
  return items;
}

function iconSvg(kind) {
  if (kind === "done") {
    return "<svg viewBox='0 0 16 16' width='15' height='15' fill='none' stroke='currentColor' stroke-width='2'><path d='M3 8.5l3 3 7-7'/></svg>";
  }
  return "<svg viewBox='0 0 16 16' width='15' height='15' fill='none' stroke='currentColor' stroke-width='1.5'><rect x='2.5' y='2' width='11' height='12' rx='1.5'/><path d='M5.5 5.5h5M5.5 8h5M5.5 10.5h3'/></svg>";
}

function renderNav() {
  var items = buildNavModel();
  var html = "";
  items.forEach(function(item, idx) {
    var isActive = false;
    if (item.type === "content") isActive = state.page === item.page;
    else if (item.type === "quiz") isActive = isQuizPage();
    else isActive = isResultsPage();

    var enabled = item.page <= state.maxVisited;
    var done = !isActive && item.page < state.maxVisited;
    var classes = "nav-item";
    if (isActive) classes += " active";
    if (done) classes += " done";
    html += "<li><button class='" + classes + "' type='button' data-page='" + item.page + "'" + (enabled ? "" : " disabled") + ">";
    html += "<span class='nav-icon'>" + iconSvg(done ? "done" : "page") + "</span>";
    html += "<span>" + item.label + "</span></button></li>";
    if (item.type === "quiz") html += "<li><div class='nav-divider'></div></li>";
  });
  navList.innerHTML = html;
  var buttons = navList.querySelectorAll(".nav-item");
  for (var b = 0; b < buttons.length; b += 1) {
    buttons[b].addEventListener("click", function(event) {
      var page = parseInt(event.currentTarget.getAttribute("data-page"), 10);
      if (page <= state.maxVisited) {
        goToPage(page);
        document.body.classList.remove("nav-open");
      }
    });
  }
}

function updateProgress() {
  var pct = Math.round((state.maxVisited / (getTotalPages() - 1)) * 100);
  if (pct > 100) pct = 100;
  progressFill.style.width = pct + "%";
  progressLabel.textContent = "You completed " + pct + "%";
}

function render() {
  ensureQuestions();
  var totalPages = getTotalPages();
  if (state.page < 0) state.page = 0;
  if (state.page >= totalPages) state.page = totalPages - 1;
  state.maxVisited = Math.max(state.maxVisited, state.page);

  if (state.page < contentCount) {
    renderContentPage(COURSE.pages[state.page]);
  } else if (isQuizPage()) {
    renderQuizPage(getCurrentQuestionIndex());
  } else {
    renderResultsPage();
  }

  navHint.textContent = isQuizPage() && !answeredCurrentQuestion() ? "Answer this question to continue." : "";
  prevBtn.disabled = state.page === 0;
  nextBtn.style.display = isResultsPage() ? "none" : "";
  if (state.page === 0) nextBtn.textContent = "Start course";
  else if (state.page === totalPages - 2) nextBtn.textContent = "See results";
  else nextBtn.textContent = "Next";
  nextBtn.disabled = isQuizPage() && !answeredCurrentQuestion();

  statusBadge.title = state.completed ? "Passed" : "Not completed";

  updateProgress();
  renderNav();
  persist();
}

function goToPage(page) {
  state.page = page;
  render();
  window.scrollTo(0, 0);
  document.querySelector(".content-scroll").scrollTop = 0;
}

function navigate(direction) {
  var nextPage = state.page + direction;
  if (nextPage < 0 || nextPage >= getTotalPages()) return;
  if (direction > 0 && isQuizPage() && !answeredCurrentQuestion()) return;
  if (nextPage === resultsOffset && !allQuizAnswered()) return;
  goToPage(nextPage);
}

function answerQuestion(question, selected) {
  if (state.quizAnswers[question.id]) return;
  var correct = selected === question.answer;
  state.quizAnswers[question.id] = { selected: selected, correct: correct };
  renderQuizPage(getCurrentQuestionIndex());
  nextBtn.disabled = false;
  navHint.textContent = "";
  persist();
}

function retakeQuiz() {
  state.selectedQuestionIds = selectQuestions();
  state.quizAnswers = {};
  state.completed = false;
  state.page = contentCount;
  render();
}

prevBtn.addEventListener("click", function() { navigate(-1); });
nextBtn.addEventListener("click", function() { navigate(1); });
menuBtn.addEventListener("click", function() { document.body.classList.toggle("nav-open"); });
scrim.addEventListener("click", function() { document.body.classList.remove("nav-open"); });

window.addEventListener("beforeunload", function() {
  if (!savedAndFinished) SCORM.finish();
});

var scormBookmark = SCORM.init();
var suspended = SCORM.getSuspendData();
restoreState(suspended || loadLocal());
if (!suspended && scormBookmark && !state.page) state.page = scormBookmark;
ensureQuestions();
render();
</script>
</body>
</html>
