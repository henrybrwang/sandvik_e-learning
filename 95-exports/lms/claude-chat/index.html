<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat</title>
<script src="scorm.js"></script>
<style>
  :root {
    --page: #f5f7f8;
    --surface: #ffffff;
    --surface-muted: #eef2f4;
    --ink: #1f2933;
    --muted: #5f6f7a;
    --line: #d8e0e5;
    --accent: #1f6f78;
    --accent-strong: #155760;
    --accent-soft: #e2f1f2;
    --warning: #8a5a00;
    --warning-soft: #fff5d9;
    --success: #237a4b;
    --success-soft: #e2f3ea;
    --error: #aa2f2f;
    --error-soft: #f7e1e1;
    --focus: #0f67ff;
    --radius: 8px;
    --shadow: 0 18px 48px rgba(31, 41, 51, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }

  button,
  input {
    font: inherit;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
  }

  .brand-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
  }

  .brand-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 2px 0 0;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .status-pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface);
    padding: 6px 10px;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 36px;
  }

  .progress-wrap {
    display: grid;
    gap: 10px;
    margin-bottom: 18px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .progress-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .progress-dot {
    width: 13px;
    height: 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: default;
  }

  .progress-dot.visited {
    background: #a9c7cc;
    border-color: #a9c7cc;
    cursor: pointer;
  }

  .progress-dot.active {
    background: var(--accent);
    border-color: var(--accent);
    cursor: pointer;
  }

  .course-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .page {
    min-height: 540px;
    padding: 34px;
  }

  .page-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border: 1px solid #cae4e7;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.82rem;
    font-weight: 700;
  }

  h1 {
    font-size: 2rem;
    line-height: 1.2;
    margin: 0 0 16px;
    letter-spacing: 0;
  }

  h2 {
    font-size: 1.25rem;
    line-height: 1.3;
    margin: 28px 0 10px;
    letter-spacing: 0;
  }

  h3 {
    font-size: 1rem;
    margin: 0 0 8px;
  }

  p {
    margin: 0 0 14px;
  }

  ul,
  ol {
    margin: 10px 0 18px 22px;
    padding: 0;
  }

  li {
    margin: 6px 0;
  }

  code {
    background: var(--surface-muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.92em;
  }

  pre {
    margin: 16px 0;
    padding: 16px;
    overflow-x: auto;
    border-radius: var(--radius);
    background: #17212b;
    color: #e8eef2;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.55;
  }

  .lede {
    max-width: 760px;
    color: #35444f;
    font-size: 1.08rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 18px 0;
  }

  .grid.three {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fbfcfd;
    padding: 16px;
  }

  .callout {
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 14px 16px;
    margin: 18px 0;
  }

  .callout.warning {
    border-left-color: var(--warning);
    background: var(--warning-soft);
  }

  .callout p:last-child,
  .panel p:last-child {
    margin-bottom: 0;
  }

  .flow {
    display: grid;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
    gap: 10px;
    margin: 18px 0;
  }

  .flow-step {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    background: #fbfcfd;
  }

  .flow-step strong {
    display: block;
    color: var(--accent-strong);
    margin-bottom: 4px;
  }

  .comparison {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
  }

  .comparison th,
  .comparison td {
    border: 1px solid var(--line);
    padding: 12px;
    text-align: left;
    vertical-align: top;
  }

  .comparison th {
    background: var(--surface-muted);
  }

  .nav {
    border-top: 1px solid var(--line);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fbfcfd;
  }

  .nav-center {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .btn {
    min-height: 42px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 700;
  }

  .btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover:not(:disabled) {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .btn.ghost {
    color: var(--accent-strong);
    border-color: transparent;
    background: transparent;
  }

  .quiz-options {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }

  .quiz-option {
    width: 100%;
    min-height: 54px;
    text-align: left;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    padding: 13px 14px;
    cursor: pointer;
  }

  .quiz-option:hover:not(:disabled) {
    border-color: var(--accent);
    background: #f5fbfc;
  }

  .quiz-option.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }

  .quiz-option.wrong {
    border-color: var(--error);
    background: var(--error-soft);
  }

  .quiz-option:disabled {
    cursor: default;
  }

  .feedback {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: var(--radius);
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct {
    background: var(--success-soft);
    color: #164f31;
    border: 1px solid #bde4cc;
  }

  .feedback.wrong {
    background: var(--error-soft);
    color: #7b2020;
    border: 1px solid #ecc4c4;
  }

  .score {
    font-size: 3.5rem;
    line-height: 1;
    font-weight: 800;
    margin: 18px 0 8px;
    color: var(--accent);
  }

  .score-bar {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin: 20px 0;
  }

  .score-segment {
    height: 10px;
    border-radius: 999px;
    background: var(--line);
  }

  .score-segment.ok {
    background: var(--success);
  }

  .score-segment.fail {
    background: var(--error);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 820px) {
    .topbar-inner,
    .progress-row,
    .nav {
      align-items: stretch;
      flex-direction: column;
    }

    .top-actions {
      justify-content: flex-start;
    }

    .page {
      padding: 24px 18px;
    }

    h1 {
      font-size: 1.55rem;
    }

    .grid,
    .grid.three,
    .flow {
      grid-template-columns: 1fr;
    }

    .nav {
      gap: 10px;
    }

    .nav .btn {
      width: 100%;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">C</div>
      <div>
        <p class="brand-title">Claude Chat</p>
        <p class="brand-meta">Interactive learning module</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="status-pill" id="moduleStatus">Not completed</span>
      <button class="btn ghost" type="button" id="saveBtnTop">Save for later</button>
    </div>
  </div>
</header>

<main class="app">
  <div class="progress-wrap" aria-label="Course progress">
    <div class="progress-row">
      <span id="sectionLabel">Claude Chat</span>
      <span id="pageLabel">Page 1 / 1</span>
    </div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <section class="course-shell" aria-live="polite">
    <div class="page" id="pageRoot"></div>
    <div class="nav">
      <button class="btn" type="button" id="prevBtn">Back</button>
      <span class="nav-center" id="navHint"></span>
      <button class="btn primary" type="button" id="nextBtn">Next</button>
    </div>
  </section>
</main>

<script>
var COURSE = {
  "id": "claude-chat",
  "title": "Claude Chat",
  "passingScore": 80,
  "questionsToServe": 10,
  "pages": [
    {
      "tag": "Overview",
      "section": "Start",
      "title": "Claude Chat: practical basics",
      "body": [
        "<p class=\"lede\">This module introduces Claude Chat as a day-to-day work partner for asking questions, drafting, summarizing, analyzing, translating, comparing options, and creating reusable outputs.</p>",
        "<div class=\"callout\"><p><strong>Your responsibility stays the same.</strong> Claude can help accelerate work, but users remain responsible for what they enter, approve, share, and publish. Follow Sandvik policy, protect sensitive information, and review outputs before relying on them.</p></div>",
        "<div class=\"grid three\"><div class=\"panel\"><h3>Duration</h3><p>35-45 minutes.</p></div><div class=\"panel\"><h3>Completion</h3><p>scored quiz with an 80% passing score.</p></div><div class=\"panel\"><h3>Audience</h3><p>Sandvik users ordering Claude Chat.</p></div></div>"
      ]
    },
    {
      "tag": "Overview",
      "section": "Start",
      "title": "Overview And Audience",
      "body": [
        "<p>Claude Chat is the conversational Claude experience. It is best for turn-by-turn work where you ask questions, draft text, analyze information, summarize content, translate, brainstorm, compare options, or create reusable outputs such as documents and artifacts.</p><p>This module is for users who need Claude as a daily work partner. It explains the practical basics: how Claude uses context, what happens when usage limits are reached, what projects, connectors, and skills are, and how to review outputs before using them.</p><p>Claude Chat is not the same as an autonomous desktop agent, coding agent, or design-only tool. If the work requires Claude to operate across many files, browser steps, development tools, or visual design deliverables, another Claude product may be a better fit.</p>"
      ]
    },
    {
      "tag": "Learning Objectives",
      "section": "Start",
      "title": "Learning Objectives",
      "body": [
        "<p>After this module, users should be able to:</p><ul><li>Decide when Claude Chat is the right product for a task.</li><li>Explain why context is what makes Claude useful for a specific work problem.</li><li>Turn vague requests into clearer context, framing, and specification.</li><li>Explain what people usually mean by agentic AI and tool use.</li><li>Understand five-hour session limits, weekly limits, pay-as-you-go usage, and the Sandvik path for requesting a higher monthly spending limit.</li><li>Use files, projects, memory, connectors, skills, and artifacts responsibly where approved.</li><li>Recognize hallucination, missing context, outdated information, and unsupported claims.</li><li>Protect Sandvik information and avoid entering prohibited data.</li><li>Review Claude outputs before using them in decisions or communication.</li><li>Know when to use Claude Cowork, Claude Code, or Claude Design instead.</li></ul>"
      ]
    },
    {
      "tag": "Product Fit",
      "section": "Concepts",
      "title": "When To Use Claude Chat",
      "body": [
        "<p>Use Claude Chat when:</p><ul><li>You are still thinking through a problem and want an interactive thought partner.</li><li>You need a first draft, summary, translation, comparison, checklist, or structured analysis.</li><li>The task is small enough to steer through a conversation.</li><li>You want to upload or paste selected context and ask questions about it.</li><li>You want text or an artifact you can inspect, edit, and reuse.</li></ul><p>Use a different Claude product when:</p><ul><li>The work is a clear deliverable that spans many files, tools, browser steps, or desktop actions: consider Claude Cowork.</li><li>The work requires reading and changing a codebase, running tests, or using development tools: consider Claude Code.</li><li>The main output is visual exploration, prototypes, slides, or design concepts: consider Claude Design.</li></ul>"
      ]
    },
    {
      "tag": "Agentic AI",
      "section": "Concepts",
      "title": "What People Mean By Agentic AI",
      "body": [
        "<p>&quot;Agentic AI&quot; is a common phrase, and people use it in different ways. In practice, they usually mean that the AI does more than answer in one step. It may follow a flow, take multiple turns, use tools, retrieve information, or adapt based on what it finds.</p><p>A common comparison is to think of Agentic AI as a competent colleague. It has broad knowledge, is eager to help and is extremely fast. But it has no memory, context and tools. That's why it's important for you to provide the AI with what it is naturally lacking (similar to a new coworker).</p><p>The connection to context is important: agentic AI is useful when Claude can gather or use the right context during the flow. Claude can start with your request, notice that more information is needed, use an approved tool, and bring the result back into the conversation.</p><p>A simple example is web search:</p><ol><li>You ask Claude about important tasks to keep in mind based on last weeks email conversations.</li><li>Claude recognizes that there is a tool to access your emails.</li><li>Claude goes through your emails and finds the ones that are of importance.</li><li>The search result comes back into the conversation as new context.</li><li>Claude uses that context to answer your original question.</li></ol><p>That is a basic agentic flow: user request, tool use, returned context, and final answer. Other flows can involve approved connectors, such as searching a connected work system, or skills, such as applying a repeatable company workflow.</p><p>The easiest place to see tool use in Claude Chat is connectors. Connectors are how Claude can bring in approved work context from apps and services through permission-scoped access.</p><p>The important point for Claude Chat users is control. Claude may use tools when they are enabled and relevant, but the user remains responsible for what context is provided, which tools are approved, and whether the final answer is safe to use.</p>"
      ]
    },
    {
      "tag": "Connectors",
      "section": "Concepts",
      "title": "Connectors And Tool Access",
      "body": [
        "<p>Connectors let Claude connect to approved apps and services. A connector may let Claude retrieve data, search a system, or in some cases take actions in that service.</p><p>The practical idea is: connectors bring extra context into Claude Chat without you manually copying everything. Claude uses the connected service through the user's own login and permissions. If the user cannot access a file, channel, record, or repository in the source system, the connector should not give Claude access to it either. This is permission-scoped access, not a replacement for Sandvik policy.</p><p>Examples, if approved by Sandvik:</p><ul><li>A Microsoft 365 connector could help find or summarize work content the user is allowed to access.</li><li>A GitHub connector could help retrieve repository or issue context the user is allowed to access.</li><li>Another approved business connector could bring in task, ticket, document, or project information.</li></ul><p>Good habits:</p><ul><li>Use only Sandvik-approved connectors.</li><li>Review what Claude is trying to access or do.</li><li>Prefer narrow access and specific prompts.</li><li>Pause before Claude drafts, sends, updates, creates, deletes, or changes anything in another system.</li><li>Watch for prompt injection in retrieved content, especially emails, documents, web pages, tickets, or repositories.</li></ul><p><code>[CONNECTOR PLACEHOLDER]</code> Sandvik must confirm which connectors are approved, whether they are read-only or allow actions, and what users should do when a connector requests permissions.</p>"
      ]
    },
    {
      "tag": "Practical Basics",
      "section": "Practical Basics",
      "title": "Files",
      "body": [
        "<p>Files let Claude work with material you provide, such as a policy draft, report, spreadsheet, meeting notes, or specification. Claude can summarize, compare, extract, rewrite, and answer questions about the content.</p><p>Before adding a file, ask:</p><ul><li>Is this file approved for use in Claude?</li><li>Does it contain personal data, confidential information, secrets, credentials, export-controlled content, or regulated information?</li><li>Is the whole file needed, or can I use a smaller approved excerpt?</li><li>Am I asking Claude to use the file as source material, or to follow instructions found inside it?</li></ul><p>Treat files as data. If a document, email, or webpage contains instructions that conflict with Sandvik policy or your actual goal, do not let those instructions override your intent.</p>"
      ]
    },
    {
      "tag": "Practical Basics",
      "section": "Practical Basics",
      "title": "Projects",
      "body": [
        "<p>Projects are focused Claude workspaces with their own chats, project knowledge, and project instructions. Use a project when you will return to the same topic or set of approved materials over time.</p><p>Projects are useful for:</p><ul><li>Keeping related chats together.</li><li>Giving Claude reusable context about a team, process, document set, or workstream.</li><li>Uploading approved project knowledge once instead of attaching the same material repeatedly.</li><li>Setting stable instructions, such as preferred tone, format, or terminology.</li></ul><p>Before using or sharing a project, check:</p><ul><li>Who can access the project?</li><li>Do those people have the right to see the uploaded knowledge and chat context?</li><li>Are the project instructions still accurate?</li><li>Should outdated files be removed?</li></ul><p><code>[PROJECT PLACEHOLDER]</code> Sandvik must confirm project visibility, sharing rules, retention, and whether project knowledge and memory settings are enabled or restricted.</p>"
      ]
    },
    {
      "tag": "Practical Basics",
      "section": "Practical Basics",
      "title": "Skills",
      "body": [
        "<p>Skills are not just saved prompts. Claude skills are reusable packages of instructions, scripts, and resources that Claude can load when relevant to a task. They help Claude perform specialized work more consistently.</p><p>Skills can support workflows such as:</p><ul><li>Applying approved writing, document, or presentation guidance.</li><li>Following a standard meeting-note or report format.</li><li>Using a team-specific analysis method.</li><li>Creating outputs that follow a known template.</li></ul><p>Some skills may be provided by Anthropic, some may be installed by users, and some may be provisioned by the organization. Availability depends on Claude settings and Sandvik approval.</p><p>Good habits:</p><ul><li>Use only approved organization skills for Sandvik work.</li><li>Check whether a skill is relevant before relying on it.</li><li>Remember that a skill improves the workflow, but it does not make the output automatically correct or approved.</li></ul><p><code>[SKILLS PLACEHOLDER]</code> Sandvik must confirm which skills are enabled, whether users can add custom skills, and whether any organization skills are mandatory.</p>"
      ]
    },
    {
      "tag": "Practical Basics",
      "section": "Practical Basics",
      "title": "Memory And Chat History",
      "body": [
        "<p>Memory and chat history can help Claude build on prior context when enabled. Availability and behavior depend on plan, product surface, and organization settings.</p><p>Before relying on memory:</p><ul><li>Confirm whether memory is enabled for Sandvik users.</li><li>Check what type of information Claude may remember.</li><li>Do not assume Claude remembers a policy, file, or prior decision unless it is visible or confirmed.</li><li>For important work, provide the necessary context again.</li></ul><p><code>[MEMORY PLACEHOLDER]</code> Sandvik must confirm enterprise settings for memory, chat history, retention, and user controls.</p>"
      ]
    },
    {
      "tag": "Practical Basics",
      "section": "Practical Basics",
      "title": "Artifacts",
      "body": [
        "<p>Artifacts are standalone outputs such as documents, diagrams, visualizations, code snippets, simple web pages, or interactive components. They are useful when the output is something you will edit, reuse, download, or share.</p><p>Good habits:</p><ul><li>Treat artifacts as drafts until reviewed.</li><li>Check whether sharing an artifact also exposes underlying conversation context, attachments, or sensitive content.</li><li>Do not include sensitive Sandvik information in artifacts unless approved.</li><li>Review generated code, calculations, diagrams, and visuals before using them.</li></ul>"
      ]
    },
    {
      "tag": "Practical Basics",
      "section": "Practical Basics",
      "title": "Usage Limits",
      "body": [
        "<p>Claude usage is limited by plan and seat type. For relevant paid and seat-based plans, Claude shows both a five-hour session limit and weekly limits in Settings &gt; Usage. Sandvik users should expect the normal plan limits, including five-hour session limits and weekly limits.</p><p>Sandvik's 2026-06-16 intranet announcement says Claude Enterprise is consumption-based: there is a 350 SEK per user/month base fee, and usage costs are added depending on how much the service is used. The full cost is charged to the user's cost center with no markup.</p><p>Usage is not just a count of messages. It can be affected by:</p><ul><li>The length of your conversation.</li><li>The size and number of files, project materials, or artifacts Claude uses.</li><li>The model, effort, or thinking settings available to you.</li><li>Tool use, web search, research, connectors, and other context-heavy features.</li><li>Reusing long chats instead of starting a focused new conversation.</li></ul><p>Practical habits that can reduce repeated work:</p><ul><li>Start a new focused chat when the topic changes.</li><li>Use projects for approved materials you will reference repeatedly instead of uploading the same files again and again.</li><li>Use project instructions for stable context such as preferred tone, terminology, or output structure.</li><li>Use approved skills for recurring workflows, artifact formats, visualizations, or document patterns instead of asking Claude to rebuild the same setup every time.</li><li>Reuse and edit an existing artifact when possible instead of regenerating a similar output from scratch.</li><li>Turn off web search, research, or connectors when they are not needed for the task.</li><li>Use simpler model, effort, or thinking settings where available and appropriate for routine work.</li></ul><p>These habits can save setup time and reduce unnecessary context, but they do not remove usage limits or the need to review outputs.</p><p>When you reach a usage limit, Claude may stop accepting more work until the limit resets, or it may show options that depend on the plan and organization settings. For Sandvik users, the practical rule is:</p><ul><li>Check your usage in Settings &gt; Usage if available.</li><li>Wait for the relevant limit to reset when the work can wait.</li><li>If you need more capacity for business work, use the intranet form to request a higher monthly usage or spending limit.</li><li>Expect the higher monthly spending limit to require approval from your cost approver.</li><li>Remember that usage beyond the normal plan limits is pay as you go and charged to your cost center.</li><li>Do not move Sandvik work into private accounts or unapproved tools to avoid limits.</li></ul><p>The monthly spending limit should be visible in your Claude account. The final intranet form link and expected approval response time must be confirmed before publishing.</p>"

var storageKey = "lms_progress_" + COURSE.id;
var contentCount = COURSE.pages.length;
var resultsOffset = contentCount + COURSE.questionsToServe;
var state = {
  page: 0,
  maxVisited: 0,
  selectedQuestionIds: null,
  quizAnswers: {},
  completed: false
};
var savedAndFinished = false;

var prevBtn = document.getElementById("prevBtn");

var saveBtnTop = document.getElementById("saveBtnTop");

var sectionLabel = document.getElementById("sectionLabel");

var progressDots = document.getElementById("progressDots");
var moduleStatus = document.getElementById("moduleStatus");

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function shuffle(items) {
  var copy = items.slice();
  for (var i = copy.length - 1; i > 0; i -= 1) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

function selectQuestions() {
  return shuffle(COURSE.quizBank.map(function(question) { return question.id; })).slice(0, COURSE.questionsToServe);
}

function getQuestionById(id) {
  for (var i = 0; i < COURSE.quizBank.length; i += 1) {
    if (COURSE.quizBank[i].id === id) return COURSE.quizBank[i];
  }
  return null;
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function saveLocal() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (error) {}
}

function restoreState(saved) {
  if (!saved) return;
  if (typeof saved.page === "number") state.page = saved.page;
  if (typeof saved.maxVisited === "number") state.maxVisited = saved.maxVisited;
  if (Array.isArray(saved.selectedQuestionIds)) state.selectedQuestionIds = saved.selectedQuestionIds;
  if (saved.quizAnswers && typeof saved.quizAnswers === "object") state.quizAnswers = saved.quizAnswers;
  if (typeof saved.completed === "boolean") state.completed = saved.completed;
}

function persist() {
  SCORM.setPage(state.page);
  SCORM.saveSuspendData(state);
  saveLocal();
}

function ensureQuestions() {
  if (!Array.isArray(state.selectedQuestionIds) || state.selectedQuestionIds.length !== COURSE.questionsToServe) {
    state.selectedQuestionIds = selectQuestions();
    state.quizAnswers = {};
  }
}

function getTotalPages() {
  return contentCount + COURSE.questionsToServe + 1;
}

function getCurrentQuestionIndex() {
  return state.page - contentCount;
}

function isQuizPage() {
  return state.page >= contentCount && state.page < resultsOffset;
}

function isResultsPage() {
  return state.page === resultsOffset;
}

function allQuizAnswered() {
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    if (!state.quizAnswers[state.selectedQuestionIds[i]]) return false;
  }
  return true;
}

function answeredCurrentQuestion() {
  if (!isQuizPage()) return true;
  var questionId = state.selectedQuestionIds[getCurrentQuestionIndex()];
  return Boolean(state.quizAnswers[questionId]);
}

function escapeText(text) {
  var span = document.createElement("span");
  span.textContent = text;
  return span.innerHTML;
}

function renderContentPage(page) {
  var html = '<span class="page-tag">' + escapeText(page.tag) + '</span>';
  html += '<h1>' + escapeText(page.title) + '</h1>';
  html += page.body.join("");
  pageRoot.innerHTML = html;
}

function renderQuizPage(questionIndex) {
  var questionId = state.selectedQuestionIds[questionIndex];
  var question = getQuestionById(questionId);
  var saved = state.quizAnswers[questionId];
  var optionKeys = ["A", "B", "C", "D"];
  var html = '<span class="page-tag">Knowledge Check ' + (questionIndex + 1) + ' of ' + COURSE.questionsToServe + '</span>';
  html += '<h1>' + escapeText(question.prompt) + '</h1>';
  html += '<p class="lede">Choose the best answer. Feedback appears immediately after your selection.</p>';
  html += '<div class="quiz-options" role="group" aria-label="Answer options">';
  optionKeys.forEach(function(key) {
    var classes = "quiz-option";
    if (saved) {
      if (key === question.answer) classes += " correct";
      else if (key === saved.selected) classes += " wrong";
    }
    html += '<button class="' + classes + '" type="button" data-option="' + key + '"' + (saved ? " disabled" : "") + '><strong>' + key + '.</strong> ' + escapeText(question.options[key]) + '</button>';
  });
  html += '</div>';
  html += '<div class="feedback' + (saved ? " show " + (saved.correct ? "correct" : "wrong") : "") + '" id="feedbackBox">' + (saved ? escapeText(saved.correct ? question.correct : question.incorrect) : "") + '</div>';
  pageRoot.innerHTML = html;

  var buttons = pageRoot.querySelectorAll(".quiz-option");
  for (var i = 0; i < buttons.length; i += 1) {
    buttons[i].addEventListener("click", function(event) {
      answerQuestion(question, event.currentTarget.getAttribute("data-option"));
    });
  }
}

function calculateScore() {
  var correctCount = 0;
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    if (answer && answer.correct) correctCount += 1;
  }
  return Math.round((correctCount / COURSE.questionsToServe) * 100);
}

function renderResultsPage() {
  var score = calculateScore();
  var passed = score >= COURSE.passingScore;
  state.completed = passed;
  var html = '<span class="page-tag">Results</span>';
  html += '<h1>Your results</h1>';
  html += '<div class="score">' + score + '%</div>';
  html += '<p class="lede">' + (passed ? "Passed. You have met the 80% requirement for this module." : "Not yet passed. Review the module and retake the quiz when ready.") + '</p>';
  html += '<div class="score-bar" aria-label="Quiz result by question">';
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    html += '<span class="score-segment ' + (answer && answer.correct ? "ok" : "fail") + '"></span>';
  }
  html += '</div>';
  html += "<div class=\"grid\"><div class=\"panel\"><h3>What to remember</h3><ul><li>Claude Chat is for interactive, turn-by-turn work.</li><li>Agentic flows can use approved tools and returned context.</li><li>Use approved files, projects, connectors, skills, and artifacts carefully.</li><li>Usage limits are practical operating limits, not a reason to use unapproved tools.</li><li>Verify important outputs before relying on them.</li></ul></div><div class=\"panel\"><h3>Next action</h3><p>If this course is running in an LMS, your score is sent when you view this page.</p><button class=\"btn\" type=\"button\" id=\"retryBtn\">Retake quiz</button></div></div>";
  pageRoot.innerHTML = html;
  document.getElementById("retryBtn").addEventListener("click", retakeQuiz);
  SCORM.complete(score, passed);
  persist();
}

function renderProgress() {
  var totalPages = getTotalPages();
  var html = "";
  for (var i = 0; i < totalPages; i += 1) {
    var label = "Page " + (i + 1);
    var classes = "progress-dot";
    if (i === state.page) classes += " active";
    else if (i <= state.maxVisited) classes += " visited";
    html += '<button class="' + classes + '" type="button" data-page="' + i + '" aria-label="' + label + '"' + (i <= state.maxVisited ? "" : " disabled") + '><span class="sr-only">' + label + '</span></button>';
  }
  progressDots.innerHTML = html;
  var dots = progressDots.querySelectorAll(".progress-dot");
  for (var d = 0; d < dots.length; d += 1) {
    dots[d].addEventListener("click", function(event) {
      var page = parseInt(event.currentTarget.getAttribute("data-page"), 10);
      if (page <= state.maxVisited) goToPage(page);
    });
  }
}

function render() {
  ensureQuestions();
  var totalPages = getTotalPages();
  if (state.page < 0) state.page = 0;
  if (state.page >= totalPages) state.page = totalPages - 1;
  state.maxVisited = Math.max(state.maxVisited, state.page);

  if (state.page < contentCount) {
    renderContentPage(COURSE.pages[state.page]);
    sectionLabel.textContent = COURSE.pages[state.page].section;
  } else if (isQuizPage()) {
    renderQuizPage(getCurrentQuestionIndex());
    sectionLabel.textContent = "Knowledge Check";
  } else {
    renderResultsPage();
    sectionLabel.textContent = "Results";
  }

  pageLabel.textContent = "Page " + (state.page + 1) + " / " + totalPages;
  navHint.textContent = isQuizPage() && !answeredCurrentQuestion() ? "Answer this question to continue." : "";
  prevBtn.disabled = state.page === 0;
  nextBtn.style.display = isResultsPage() ? "none" : "";
  nextBtn.textContent = state.page === totalPages - 2 ? "See results" : "Next";
  nextBtn.disabled = isQuizPage() && !answeredCurrentQuestion();
  moduleStatus.textContent = state.completed ? "Passed" : "Not completed";
  renderProgress();
  persist();
}

function goToPage(page) {
  state.page = page;
  render();
  window.scrollTo(0, 0);
}

function navigate(direction) {
  var nextPage = state.page + direction;
  if (nextPage < 0 || nextPage >= getTotalPages()) return;
  if (direction > 0 && isQuizPage() && !answeredCurrentQuestion()) return;
  if (nextPage === resultsOffset && !allQuizAnswered()) return;
  goToPage(nextPage);
}

function answerQuestion(question, selected) {
  if (state.quizAnswers[question.id]) return;
  var correct = selected === question.answer;
  state.quizAnswers[question.id] = { selected: selected, correct: correct };
  renderQuizPage(getCurrentQuestionIndex());
  nextBtn.disabled = false;
  navHint.textContent = "";
  persist();
}

function saveLater() {
  persist();
  SCORM.finish();
  savedAndFinished = true;
  pageRoot.innerHTML = '<span class="page-tag">Saved</span><h1>Your progress has been saved</h1><p class="lede">Next time you open this course in the same LMS or browser, you should continue from page ' + (state.page + 1) + '.</p>';
  prevBtn.style.display = "none";
  nextBtn.style.display = "none";
  navHint.textContent = "You can close this window.";
}

function retakeQuiz() {
  state.selectedQuestionIds = selectQuestions();
  state.quizAnswers = {};
  state.completed = false;
  state.page = contentCount;
  state.maxVisited = contentCount;
  render();
}

prevBtn.addEventListener("click", function() { navigate(-1); });
nextBtn.addEventListener("click", function() { navigate(1); });
saveBtnTop.addEventListener("click", saveLater);

window.addEventListener("beforeunload", function() {
  if (!savedAndFinished) SCORM.finish();
});

var scormBookmark = SCORM.init();
var suspended = SCORM.getSuspendData();
restoreState(suspended || loadLocal());
if (!suspended && scormBookmark && !state.page) state.page = scormBookmark;
ensureQuestions();
render();
</script>
</body>
</html>
