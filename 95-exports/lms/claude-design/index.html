<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Design</title>
<script src="scorm.js"></script>
<style>
  :root {
    --page: #f5f7f8;
    --surface: #ffffff;
    --surface-muted: #eef2f4;
    --ink: #1f2933;
    --muted: #5f6f7a;
    --line: #d8e0e5;
    --accent: #1f6f78;
    --accent-strong: #155760;
    --accent-soft: #e2f1f2;
    --warning: #8a5a00;
    --warning-soft: #fff5d9;
    --success: #237a4b;
    --success-soft: #e2f3ea;
    --error: #aa2f2f;
    --error-soft: #f7e1e1;
    --focus: #0f67ff;
    --radius: 8px;
    --shadow: 0 18px 48px rgba(31, 41, 51, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }

  button,
  input {
    font: inherit;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
  }

  .brand-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
  }

  .brand-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 2px 0 0;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .status-pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface);
    padding: 6px 10px;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 36px;
  }

  .progress-wrap {
    display: grid;
    gap: 10px;
    margin-bottom: 18px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .progress-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .progress-dot {
    width: 13px;
    height: 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: default;
  }

  .progress-dot.visited {
    background: #a9c7cc;
    border-color: #a9c7cc;
    cursor: pointer;
  }

  .progress-dot.active {
    background: var(--accent);
    border-color: var(--accent);
    cursor: pointer;
  }

  .course-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .page {
    min-height: 540px;
    padding: 34px;
  }

  .page-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border: 1px solid #cae4e7;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.82rem;
    font-weight: 700;
  }

  h1 {
    font-size: 2rem;
    line-height: 1.2;
    margin: 0 0 16px;
    letter-spacing: 0;
  }

  h2 {
    font-size: 1.25rem;
    line-height: 1.3;
    margin: 28px 0 10px;
    letter-spacing: 0;
  }

  h3 {
    font-size: 1rem;
    margin: 0 0 8px;
  }

  p {
    margin: 0 0 14px;
  }

  ul,
  ol {
    margin: 10px 0 18px 22px;
    padding: 0;
  }

  li {
    margin: 6px 0;
  }

  code {
    background: var(--surface-muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.92em;
  }

  pre {
    margin: 16px 0;
    padding: 16px;
    overflow-x: auto;
    border-radius: var(--radius);
    background: #17212b;
    color: #e8eef2;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.55;
  }

  .lede {
    max-width: 760px;
    color: #35444f;
    font-size: 1.08rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 18px 0;
  }

  .grid.three {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fbfcfd;
    padding: 16px;
  }

  .callout {
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 14px 16px;
    margin: 18px 0;
  }

  .callout.warning {
    border-left-color: var(--warning);
    background: var(--warning-soft);
  }

  .callout p:last-child,
  .panel p:last-child {
    margin-bottom: 0;
  }

  .flow {
    display: grid;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
    gap: 10px;
    margin: 18px 0;
  }

  .flow-step {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    background: #fbfcfd;
  }

  .flow-step strong {
    display: block;
    color: var(--accent-strong);
    margin-bottom: 4px;
  }

  .comparison {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
  }

  .comparison th,
  .comparison td {
    border: 1px solid var(--line);
    padding: 12px;
    text-align: left;
    vertical-align: top;
  }

  .comparison th {
    background: var(--surface-muted);
  }

  .nav {
    border-top: 1px solid var(--line);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fbfcfd;
  }

  .nav-center {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .btn {
    min-height: 42px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 700;
  }

  .btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover:not(:disabled) {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .btn.ghost {
    color: var(--accent-strong);
    border-color: transparent;
    background: transparent;
  }

  .quiz-options {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }

  .quiz-option {
    width: 100%;
    min-height: 54px;
    text-align: left;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    padding: 13px 14px;
    cursor: pointer;
  }

  .quiz-option:hover:not(:disabled) {
    border-color: var(--accent);
    background: #f5fbfc;
  }

  .quiz-option.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }

  .quiz-option.wrong {
    border-color: var(--error);
    background: var(--error-soft);
  }

  .quiz-option:disabled {
    cursor: default;
  }

  .feedback {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: var(--radius);
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct {
    background: var(--success-soft);
    color: #164f31;
    border: 1px solid #bde4cc;
  }

  .feedback.wrong {
    background: var(--error-soft);
    color: #7b2020;
    border: 1px solid #ecc4c4;
  }

  .score {
    font-size: 3.5rem;
    line-height: 1;
    font-weight: 800;
    margin: 18px 0 8px;
    color: var(--accent);
  }

  .score-bar {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin: 20px 0;
  }

  .score-segment {
    height: 10px;
    border-radius: 999px;
    background: var(--line);
  }

  .score-segment.ok {
    background: var(--success);
  }

  .score-segment.fail {
    background: var(--error);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 820px) {
    .topbar-inner,
    .progress-row,
    .nav {
      align-items: stretch;
      flex-direction: column;
    }

    .top-actions {
      justify-content: flex-start;
    }

    .page {
      padding: 24px 18px;
    }

    h1 {
      font-size: 1.55rem;
    }

    .grid,
    .grid.three,
    .flow {
      grid-template-columns: 1fr;
    }

    .nav {
      gap: 10px;
    }

    .nav .btn {
      width: 100%;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">C</div>
      <div>
        <p class="brand-title">Claude Design</p>
        <p class="brand-meta">Interactive learning module</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="status-pill" id="moduleStatus">Not completed</span>
      <button class="btn ghost" type="button" id="saveBtnTop">Save for later</button>
    </div>
  </div>
</header>

<main class="app">
  <div class="progress-wrap" aria-label="Course progress">
    <div class="progress-row">
      <span id="sectionLabel">Claude Design</span>
      <span id="pageLabel">Page 1 / 1</span>
    </div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <section class="course-shell" aria-live="polite">
    <div class="page" id="pageRoot"></div>
    <div class="nav">
      <button class="btn" type="button" id="prevBtn">Back</button>
      <span class="nav-center" id="navHint"></span>
      <button class="btn primary" type="button" id="nextBtn">Next</button>
    </div>
  </section>
</main>

<script>
var COURSE = {
  "id": "claude-design",
  "title": "Claude Design",
  "passingScore": 80,
  "questionsToServe": 8,
  "pages": [
    {
      "tag": "Start",
      "section": "Start",
      "title": "Claude Design",
      "body": [
        "<p>Estimated duration: 20-30 minutes Completion: scored quiz Audience: Sandvik users ordering Claude Design</p>",
        "<div class=\"callout\"><p>Claude can help accelerate work, but users remain responsible for what they enter, approve, share, and publish. Follow Sandvik policy, protect sensitive information, and review outputs before relying on them.</p></div>"
      ]
    },
    {
      "tag": "Overview And Audience",
      "section": "Overview And Audience",
      "title": "Overview And Audience",
      "body": [
        "<p>Claude Design is for creating visual work with Claude, such as design directions, prototypes, slides, one-pagers, layouts, graphics, and shareable visual concepts. You can start from a rough idea, source material, approved assets, or a design system, then refine the result through feedback until it is ready for human review.</p>",
        "<p>As of the 2026-06-16 source check, Anthropic describes Claude Design as a research-preview product for Claude Pro, Max, Team, and Enterprise subscribers. For Enterprise organizations, Anthropic says Claude Design is off by default and must be enabled by an administrator. Sandvik availability, settings, approved inputs, export routes, and review rules must be confirmed before this module is published.</p>",
        "<p>At Sandvik, Claude Design is one of the selectable tools under the Claude Enterprise license. The intranet launch context describes it as a visual design agent for creating and refining designs, layouts, and graphics through chat.</p>",
        "<p>This module is for users who need Claude to help explore, draft, or refine visual outputs while following Sandvik brand, legal, accessibility, information protection, and review expectations.</p>"
      ]
    },
    {
      "tag": "Learning Objectives",
      "section": "Learning Objectives",
      "title": "Learning Objectives",
      "body": [
        "<p>After this module, users should be able to:</p>",
        "<ul><li>Decide when Claude Design is the right product.</li><li>Prepare approved source material, assets, and constraints before designing.</li><li>Write a clear visual brief.</li><li>Explore, compare, and refine design directions without treating them as final.</li><li>Review outputs for brand, accessibility, factual accuracy, IP risk, sensitive information, and audience fit.</li><li>Export, share, hand off, and monitor usage through approved routes.</li></ul>"
      ]
    },
    {
      "tag": "When To Use Claude Design",
      "section": "When To Use Claude Design",
      "title": "When To Use Claude Design",
      "body": [
        "<p>Use Claude Design when the main output is visual and reviewable. Good fits include:</p>",
        "<ul><li>Exploring several visual directions before choosing one.</li><li>Creating an internal one-pager, slide concept, layout, or visual explanation.</li><li>Creating a prototype concept before investing in production implementation.</li><li>Preparing a draft that a designer, Brand, Legal, or business owner can review.</li></ul>",
        "<p>Use another Claude product when:</p>",
        "<ul><li>The task is mainly text, analysis, or discussion: use Claude Chat.</li><li>The task is a multi-step deliverable across files or desktop tools: use Claude Cowork.</li><li>The task requires production code, repository changes, tests, or pull requests: use Claude Code.</li></ul>",
        "<p>Do not use Claude Design to bypass review. A polished generated design is still a draft until the right owner approves it.</p>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "1. Choose The Fit And Outcome",
      "body": [
        "<p>Start by naming the deliverable and the decision it should support. A design exploration for a meeting is different from a prototype that may later become software, and both are different from external-facing campaign material.</p>",
        "<p>Before designing, identify the audience, intended action, internal or external sharing status, approved sources, required reviewers, and target format.</p>",
        "<p>If the answers are unclear, use Claude Chat first to clarify the message, audience, and source material before moving into visual work.</p>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "2. Prepare Sources And Assets",
      "body": [
        "<p>Visual work can expose information quickly. Before prompting, prepare the smallest approved source set that can support the design.</p>",
        "<p>Approved-source and asset checklist:</p>",
        "<ul><li>Use approved Sandvik templates, brand assets, imagery, colors, typography, and product names where available.</li><li>Remove unrelated files, personal data, confidential figures, customer names, supplier details, and screenshots Claude does not need.</li><li>Replace missing logos, screenshots, customer names, or visual assets with clear placeholders.</li><li>Confirm that charts, numbers, dates, claims, and third-party material are sourced and allowed.</li><li>Track source material so reviewers can verify the output.</li></ul>",
        "<p>If an approved asset is missing, do not ask Claude to invent it. Ask Claude to mark it clearly:</p>",
        "<pre>Do not invent Sandvik logos, product screenshots, customer logos, certification marks, or brand assets.\nUse [BRAND PLACEHOLDER] or [SCREENSHOT PLACEHOLDER] where approved material is required.</pre>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "3. Write A Visual Brief",
      "body": [
        "<p>A good design prompt is a brief, not a vibe request. It gives Claude enough context to make design choices while keeping policy boundaries visible.</p>",
        "<p>Visual brief template:</p>",
        "<pre>Goal:\nAudience:\nUse case:\nSource material:\nFormat:\nBrand constraints:\nAccessibility needs:\nDo not use:\nReview required:\nOutput needed:</pre>",
        "<p>Example:</p>",
        "<pre>Goal: Create a draft one-page internal concept sheet.\nAudience: Sandvik managers.\nUse case: Explain a proposed onboarding workflow before a review meeting.\nSource material: Use only the notes pasted below.\nFormat: One-page layout with sections and review notes.\nBrand constraints: Use Sandvik-approved visual style only. Mark missing assets as [BRAND PLACEHOLDER].\nAccessibility needs: Clear headings, readable contrast, no meaning by color alone.\nDo not use: External images, invented metrics, real employee names, or customer details.\nReview required: Brand, process owner, and Legal if shared outside Sandvik.\nOutput needed: Editable draft structure plus a list of facts to verify.</pre>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "4. Explore Directions, Then Choose",
      "body": [
        "<p>Claude Design is useful for exploring options quickly. Ask for a small number of distinct directions, then choose one to refine. This keeps exploration useful without burning unnecessary usage.</p>",
        "<p>Good exploration prompt:</p>",
        "<pre>Create three distinct visual directions for this internal one-pager.\nFor each direction, describe the layout, intended audience effect, strengths, risks, and what source facts still need verification.\nDo not finalize the design yet.</pre>",
        "<p>Choose based on the business goal, not only appearance. A strong leadership concept may be too dense for frontline users, and a visually striking prototype may still fail if the flow is unclear or inaccessible.</p>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "5. Refine With Specific Feedback",
      "body": [
        "<p>Refinement works best when feedback is specific. Instead of &quot;make it better,&quot; name the problem and the desired change.</p>",
        "<p>Useful refinement prompts:</p>",
        "<ul><li>&quot;Make the hierarchy clearer: the action users must take should be visible first.&quot;</li><li>&quot;Simplify the wording for global English readers.&quot;</li><li>&quot;Reduce the number of sections and keep only decision-relevant information.&quot;</li><li>&quot;Show the same workflow as a three-step process and a swimlane option.&quot;</li><li>&quot;Mark all unsupported numbers as [CHECK REQUIRED].&quot;</li><li>&quot;Keep the layout, but replace invented imagery with [BRAND PLACEHOLDER].&quot;</li></ul>",
        "<p>If Claude Design offers fine-grained editing, inline comments, direct text edits, design-system support, or export options, use them only within Sandvik-approved settings. Product features do not replace Sandvik policy.</p>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "6. Review Before Sharing",
      "body": [
        "<p>Generated visual work can look finished before it is ready. Treat every output as a draft until approved.</p>",
        "<p>Design review checklist:</p>",
        "<ul><li>Purpose: The design supports the intended audience and decision.</li><li>Source accuracy: Facts, numbers, dates, names, and claims match approved source material.</li><li>Brand: Logos, colors, typography, templates, product names, and imagery follow approved Sandvik guidance or are marked as placeholders.</li><li>Accessibility: Headings are clear, text is readable, contrast is sufficient, and meaning does not rely on color alone.</li><li>Data protection: Screenshots, diagrams, labels, charts, and metadata do not expose unnecessary personal, confidential, customer, supplier, or restricted information.</li><li>IP and legal: Third-party images, icons, logos, references, and generated media are allowed or removed.</li><li>Status and handoff: The draft or approval status, sharing limits, and any production assumptions are documented.</li></ul>",
        "<p>For external use, do not publish generated Sandvik-branded material without Brand and Legal review according to Sandvik rules.</p>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "7. Export, Share, Or Handoff",
      "body": [
        "<p>Claude Design may support sharing inside an organization, exporting to formats such as PDF, PPTX, HTML, or other tools, and packaging design work for handoff to Claude Code. Use only the routes Sandvik approves.</p>",
        "<p>Export, sharing, and handoff checklist:</p>",
        "<ul><li>Use approved export formats and Sandvik storage locations.</li><li>Confirm who can view, comment, or edit before sharing a link.</li><li>Remove unnecessary sensitive information and check for metadata or hidden content.</li><li>Label drafts clearly and include source facts reviewers should verify.</li><li>State what is design intent, what is approved, and what still needs review.</li></ul>",
        "<p>If the design becomes production software, hand off to Claude Code or a development team. Include purpose, audience, selected concept, approved assets, source data, accessibility notes, open brand or legal questions, and implementation notes. A prototype is not production-ready software.</p>"
      ]
    },
    {
      "tag": "Claude Design Workflow",
      "section": "Claude Design Workflow",
      "title": "8. Monitor Usage And Cost",
      "body": [
        "<p>Visual exploration can involve many iterations, generated variants, large files, exports, and repeated refinement. Sandvik users have normal plan usage limits, including five-hour session limits and weekly limits. Further use is pay as you go and charged to the user&#x27;s cost center.</p>",
        "<p>Good usage habits:</p>",
        "<ul><li>Start with a clear brief.</li><li>Explore a limited number of directions, then choose before deep refinement.</li><li>Reuse approved templates and avoid uploading unnecessary files.</li><li>Request a higher monthly usage or spending limit through the intranet form when business needs justify it.</li></ul>",
        "<p>Higher monthly usage or spending limits require cost-approver approval. The monthly spending limit should be visible in the user&#x27;s Claude account.</p>"
      ]
    },
    {
      "tag": "Sandvik Policy Placeholders",
      "section": "Sandvik Policy Placeholders",
      "title": "Sandvik Policy Placeholders",
      "body": [
        "<p>The following must be finalized before publishing:</p>",
        "<ul><li><code>[BRAND PLACEHOLDER]</code> Approved brand assets, design systems, templates, colors, typography, imagery, and logo rules.</li><li><code>[IP PLACEHOLDER]</code> Use of third-party images, icons, references, style examples, and generated media.</li><li><code>[EXTERNAL SHARING PLACEHOLDER]</code> Rules for publishing or sharing visual outputs outside Sandvik.</li><li><code>[ACCESSIBILITY PLACEHOLDER]</code> Accessibility standard and review process.</li><li><code>[SCREENSHOT PLACEHOLDER]</code> Rules for screenshots of internal systems or data.</li><li><code>[EXPORT PLACEHOLDER]</code> Approved export formats, internal sharing settings, and storage locations.</li><li><code>[COST PLACEHOLDER]</code> Final intranet form link, cost-approver workflow details, monthly spending-limit visibility, and expected response time.</li></ul>",
        "<p>Default until approved: treat generated designs as internal drafts and do not publish externally without Brand and Legal review.</p>"
      ]
    },
    {
      "tag": "Practical Scenarios",
      "section": "Practical Scenarios",
      "title": "Internal One-Pager",
      "body": [
        "<pre>Create an internal one-page draft from the notes below.\nAudience: global business users.\nPurpose: explain what changes, why it matters, what users need to do, and where to get help.\nUse only the supplied notes. Mark unsupported claims as [CHECK REQUIRED].\nUse [BRAND PLACEHOLDER] for missing Sandvik assets.\nReturn a draft layout plus a short review checklist for the process owner.</pre>"
      ]
    },
    {
      "tag": "Practical Scenarios",
      "section": "Practical Scenarios",
      "title": "Slide Concept",

var storageKey = "lms_progress_" + COURSE.id;
var contentCount = COURSE.pages.length;
var resultsOffset = contentCount + COURSE.questionsToServe;
var state = {
  page: 0,
  maxVisited: 0,
  selectedQuestionIds: null,
  quizAnswers: {},
  completed: false
};
var savedAndFinished = false;

var pageRoot = document.getElementById("pageRoot");
var prevBtn = document.getElementById("prevBtn");
var nextBtn = document.getElementById("nextBtn");
var saveBtnTop = document.getElementById("saveBtnTop");
var pageLabel = document.getElementById("pageLabel");
var sectionLabel = document.getElementById("sectionLabel");
var navHint = document.getElementById("navHint");
var progressDots = document.getElementById("progressDots");
var moduleStatus = document.getElementById("moduleStatus");

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function shuffle(items) {
  var copy = items.slice();
  for (var i = copy.length - 1; i > 0; i -= 1) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

function selectQuestions() {
  return shuffle(COURSE.quizBank.map(function(question) { return question.id; })).slice(0, COURSE.questionsToServe);
}

function getQuestionById(id) {
  for (var i = 0; i < COURSE.quizBank.length; i += 1) {
    if (COURSE.quizBank[i].id === id) return COURSE.quizBank[i];
  }
  return null;
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function saveLocal() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (error) {}
}

function restoreState(saved) {
  if (!saved) return;
  if (typeof saved.page === "number") state.page = saved.page;
  if (typeof saved.maxVisited === "number") state.maxVisited = saved.maxVisited;
  if (Array.isArray(saved.selectedQuestionIds)) state.selectedQuestionIds = saved.selectedQuestionIds;
  if (saved.quizAnswers && typeof saved.quizAnswers === "object") state.quizAnswers = saved.quizAnswers;
  if (typeof saved.completed === "boolean") state.completed = saved.completed;
}

function persist() {
  SCORM.setPage(state.page);
  SCORM.saveSuspendData(state);
  saveLocal();
}

function ensureQuestions() {
  if (!Array.isArray(state.selectedQuestionIds) || state.selectedQuestionIds.length !== COURSE.questionsToServe) {
    state.selectedQuestionIds = selectQuestions();
    state.quizAnswers = {};
  }
}

function getTotalPages() {
  return contentCount + COURSE.questionsToServe + 1;
}

function getCurrentQuestionIndex() {
  return state.page - contentCount;
}

function isQuizPage() {
  return state.page >= contentCount && state.page < resultsOffset;
}

function isResultsPage() {
  return state.page === resultsOffset;
}

function allQuizAnswered() {
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    if (!state.quizAnswers[state.selectedQuestionIds[i]]) return false;
  }
  return true;
}

function answeredCurrentQuestion() {
  if (!isQuizPage()) return true;
  var questionId = state.selectedQuestionIds[getCurrentQuestionIndex()];
  return Boolean(state.quizAnswers[questionId]);
}

function escapeText(text) {
  var span = document.createElement("span");
  span.textContent = text;
  return span.innerHTML;
}

function renderContentPage(page) {
  var html = '<span class="page-tag">' + escapeText(page.tag) + '</span>';
  html += '<h1>' + escapeText(page.title) + '</h1>';
  html += page.body.join("");
  pageRoot.innerHTML = html;
}

function renderQuizPage(questionIndex) {
  var questionId = state.selectedQuestionIds[questionIndex];
  var question = getQuestionById(questionId);
  var saved = state.quizAnswers[questionId];
  var optionKeys = ["A", "B", "C", "D"];
  var html = '<span class="page-tag">Knowledge Check ' + (questionIndex + 1) + ' of ' + COURSE.questionsToServe + '</span>';
  html += '<h1>' + escapeText(question.prompt) + '</h1>';
  html += '<p class="lede">Choose the best answer. Feedback appears immediately after your selection.</p>';
  html += '<div class="quiz-options" role="group" aria-label="Answer options">';
  optionKeys.forEach(function(key) {
    var classes = "quiz-option";
    if (saved) {
      if (key === question.answer) classes += " correct";
      else if (key === saved.selected) classes += " wrong";
    }
    html += '<button class="' + classes + '" type="button" data-option="' + key + '"' + (saved ? " disabled" : "") + '><strong>' + key + '.</strong> ' + escapeText(question.options[key]) + '</button>';
  });
  html += '</div>';
  html += '<div class="feedback' + (saved ? " show " + (saved.correct ? "correct" : "wrong") : "") + '" id="feedbackBox">' + (saved ? escapeText(saved.correct ? question.correct : question.incorrect) : "") + '</div>';
  pageRoot.innerHTML = html;

  var buttons = pageRoot.querySelectorAll(".quiz-option");
  for (var i = 0; i < buttons.length; i += 1) {
    buttons[i].addEventListener("click", function(event) {
      answerQuestion(question, event.currentTarget.getAttribute("data-option"));
    });
  }
}

function calculateScore() {
  var correctCount = 0;
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    if (answer && answer.correct) correctCount += 1;
  }
  return Math.round((correctCount / COURSE.questionsToServe) * 100);
}

function renderResultsPage() {
  var score = calculateScore();
  var passed = score >= COURSE.passingScore;
  state.completed = passed;
  var html = '<span class="page-tag">Results</span>';
  html += '<h1>Your results</h1>';
  html += '<div class="score">' + score + '%</div>';
  html += '<p class="lede">' + (passed ? "Passed. You have met the 80% requirement for this module." : "Not yet passed. Review the module and retake the quiz when ready.") + '</p>';
  html += '<div class="score-bar" aria-label="Quiz result by question">';
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    html += '<span class="score-segment ' + (answer && answer.correct ? "ok" : "fail") + '"></span>';
  }
  html += '</div>';
  html += "<div class=\"grid\"><div class=\"panel\"><h3>Completion</h3><p>If this course is running in an LMS, your score is sent when you view this page.</p></div><div class=\"panel\"><h3>Next action</h3><p>You can retake the quiz as needed.</p><button class=\"btn\" type=\"button\" id=\"retryBtn\">Retake quiz</button></div></div>";
  pageRoot.innerHTML = html;
  document.getElementById("retryBtn").addEventListener("click", retakeQuiz);
  SCORM.complete(score, passed);
  persist();
}

function renderProgress() {
  var totalPages = getTotalPages();
  var html = "";
  for (var i = 0; i < totalPages; i += 1) {
    var label = "Page " + (i + 1);
    var classes = "progress-dot";
    if (i === state.page) classes += " active";
    else if (i <= state.maxVisited) classes += " visited";
    html += '<button class="' + classes + '" type="button" data-page="' + i + '" aria-label="' + label + '"' + (i <= state.maxVisited ? "" : " disabled") + '><span class="sr-only">' + label + '</span></button>';
  }
  progressDots.innerHTML = html;
  var dots = progressDots.querySelectorAll(".progress-dot");
  for (var d = 0; d < dots.length; d += 1) {
    dots[d].addEventListener("click", function(event) {
      var page = parseInt(event.currentTarget.getAttribute("data-page"), 10);
      if (page <= state.maxVisited) goToPage(page);
    });
  }
}

function render() {
  ensureQuestions();
  var totalPages = getTotalPages();
  if (state.page < 0) state.page = 0;
  if (state.page >= totalPages) state.page = totalPages - 1;
  state.maxVisited = Math.max(state.maxVisited, state.page);

  if (state.page < contentCount) {
    renderContentPage(COURSE.pages[state.page]);
    sectionLabel.textContent = COURSE.pages[state.page].section;
  } else if (isQuizPage()) {
    renderQuizPage(getCurrentQuestionIndex());
    sectionLabel.textContent = "Knowledge Check";
  } else {
    renderResultsPage();
    sectionLabel.textContent = "Results";
  }

  pageLabel.textContent = "Page " + (state.page + 1) + " / " + totalPages;
  navHint.textContent = isQuizPage() && !answeredCurrentQuestion() ? "Answer this question to continue." : "";
  prevBtn.disabled = state.page === 0;
  nextBtn.style.display = isResultsPage() ? "none" : "";
  nextBtn.textContent = state.page === totalPages - 2 ? "See results" : "Next";
  nextBtn.disabled = isQuizPage() && !answeredCurrentQuestion();
  moduleStatus.textContent = state.completed ? "Passed" : "Not completed";
  renderProgress();
  persist();
}

function goToPage(page) {
  state.page = page;
  render();
  window.scrollTo(0, 0);
}

function navigate(direction) {
  var nextPage = state.page + direction;
  if (nextPage < 0 || nextPage >= getTotalPages()) return;
  if (direction > 0 && isQuizPage() && !answeredCurrentQuestion()) return;
  if (nextPage === resultsOffset && !allQuizAnswered()) return;
  goToPage(nextPage);
}

function answerQuestion(question, selected) {
  if (state.quizAnswers[question.id]) return;
  var correct = selected === question.answer;
  state.quizAnswers[question.id] = { selected: selected, correct: correct };
  renderQuizPage(getCurrentQuestionIndex());
  nextBtn.disabled = false;
  navHint.textContent = "";
  persist();
}

function saveLater() {
  persist();
  SCORM.finish();
  savedAndFinished = true;
  pageRoot.innerHTML = '<span class="page-tag">Saved</span><h1>Your progress has been saved</h1><p class="lede">Next time you open this course in the same LMS or browser, you should continue from page ' + (state.page + 1) + '.</p>';
  prevBtn.style.display = "none";
  nextBtn.style.display = "none";
  navHint.textContent = "You can close this window.";
}

function retakeQuiz() {
  state.selectedQuestionIds = selectQuestions();
  state.quizAnswers = {};
  state.completed = false;
  state.page = contentCount;
  state.maxVisited = contentCount;
  render();
}

prevBtn.addEventListener("click", function() { navigate(-1); });
nextBtn.addEventListener("click", function() { navigate(1); });
saveBtnTop.addEventListener("click", saveLater);

window.addEventListener("beforeunload", function() {
  if (!savedAndFinished) SCORM.finish();
});

var scormBookmark = SCORM.init();
var suspended = SCORM.getSuspendData();
restoreState(suspended || loadLocal());
if (!suspended && scormBookmark && !state.page) state.page = scormBookmark;
ensureQuestions();
render();
</script>
