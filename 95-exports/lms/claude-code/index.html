<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code</title>
<script src="scorm.js"></script>
<style>
  :root {
    --page: #f5f7f8;
    --surface: #ffffff;
    --surface-muted: #eef2f4;
    --ink: #1f2933;
    --muted: #5f6f7a;
    --line: #d8e0e5;
    --accent: #1f6f78;
    --accent-strong: #155760;
    --accent-soft: #e2f1f2;
    --warning: #8a5a00;
    --warning-soft: #fff5d9;
    --success: #237a4b;
    --success-soft: #e2f3ea;
    --error: #aa2f2f;
    --error-soft: #f7e1e1;
    --focus: #0f67ff;
    --radius: 8px;
    --shadow: 0 18px 48px rgba(31, 41, 51, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }

  button,
  input {
    font: inherit;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
  }

  .brand-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
  }

  .brand-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 2px 0 0;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .status-pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface);
    padding: 6px 10px;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 36px;
  }

  .progress-wrap {
    display: grid;
    gap: 10px;
    margin-bottom: 18px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .progress-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .progress-dot {
    width: 13px;
    height: 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: default;
  }

  .progress-dot.visited {
    background: #a9c7cc;
    border-color: #a9c7cc;
    cursor: pointer;
  }

  .progress-dot.active {
    background: var(--accent);
    border-color: var(--accent);
    cursor: pointer;
  }

  .course-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .page {
    min-height: 540px;
    padding: 34px;
  }

  .page-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border: 1px solid #cae4e7;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.82rem;
    font-weight: 700;
  }

  h1 {
    font-size: 2rem;
    line-height: 1.2;
    margin: 0 0 16px;
    letter-spacing: 0;
  }

  h2 {
    font-size: 1.25rem;
    line-height: 1.3;
    margin: 28px 0 10px;
    letter-spacing: 0;
  }

  h3 {
    font-size: 1rem;
    margin: 0 0 8px;
  }

  p {
    margin: 0 0 14px;
  }

  ul,
  ol {
    margin: 10px 0 18px 22px;
    padding: 0;
  }

  li {
    margin: 6px 0;
  }

  code {
    background: var(--surface-muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.92em;
  }

  pre {
    margin: 16px 0;
    padding: 16px;
    overflow-x: auto;
    border-radius: var(--radius);
    background: #17212b;
    color: #e8eef2;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.55;
  }

  .lede {
    max-width: 760px;
    color: #35444f;
    font-size: 1.08rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 18px 0;
  }

  .grid.three {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fbfcfd;
    padding: 16px;
  }

  .callout {
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 14px 16px;
    margin: 18px 0;
  }

  .callout.warning {
    border-left-color: var(--warning);
    background: var(--warning-soft);
  }

  .callout p:last-child,
  .panel p:last-child {
    margin-bottom: 0;
  }

  .flow {
    display: grid;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
    gap: 10px;
    margin: 18px 0;
  }

  .flow-step {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    background: #fbfcfd;
  }

  .flow-step strong {
    display: block;
    color: var(--accent-strong);
    margin-bottom: 4px;
  }

  .comparison {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
  }

  .comparison th,
  .comparison td {
    border: 1px solid var(--line);
    padding: 12px;
    text-align: left;
    vertical-align: top;
  }

  .comparison th {
    background: var(--surface-muted);
  }

  .nav {
    border-top: 1px solid var(--line);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fbfcfd;
  }

  .nav-center {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .btn {
    min-height: 42px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 700;
  }

  .btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover:not(:disabled) {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .btn.ghost {
    color: var(--accent-strong);
    border-color: transparent;
    background: transparent;
  }

  .quiz-options {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }

  .quiz-option {
    width: 100%;
    min-height: 54px;
    text-align: left;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    padding: 13px 14px;
    cursor: pointer;
  }

  .quiz-option:hover:not(:disabled) {
    border-color: var(--accent);
    background: #f5fbfc;
  }

  .quiz-option.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }

  .quiz-option.wrong {
    border-color: var(--error);
    background: var(--error-soft);
  }

  .quiz-option:disabled {
    cursor: default;
  }

  .feedback {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: var(--radius);
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct {
    background: var(--success-soft);
    color: #164f31;
    border: 1px solid #bde4cc;
  }

  .feedback.wrong {
    background: var(--error-soft);
    color: #7b2020;
    border: 1px solid #ecc4c4;
  }

  .score {
    font-size: 3.5rem;
    line-height: 1;
    font-weight: 800;
    margin: 18px 0 8px;
    color: var(--accent);
  }

  .score-bar {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin: 20px 0;
  }

  .score-segment {
    height: 10px;
    border-radius: 999px;
    background: var(--line);
  }

  .score-segment.ok {
    background: var(--success);
  }

  .score-segment.fail {
    background: var(--error);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 820px) {
    .topbar-inner,
    .progress-row,
    .nav {
      align-items: stretch;
      flex-direction: column;
    }

    .top-actions {
      justify-content: flex-start;
    }

    .page {
      padding: 24px 18px;
    }

    h1 {
      font-size: 1.55rem;
    }

    .grid,
    .grid.three,
    .flow {
      grid-template-columns: 1fr;
    }

    .nav {
      gap: 10px;
    }

    .nav .btn {
      width: 100%;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">C</div>
      <div>
        <p class="brand-title">Claude Code</p>
        <p class="brand-meta">Interactive learning module</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="status-pill" id="moduleStatus">Not completed</span>
      <button class="btn ghost" type="button" id="saveBtnTop">Save for later</button>
    </div>
  </div>
</header>

<main class="app">
  <div class="progress-wrap" aria-label="Course progress">
    <div class="progress-row">
      <span id="sectionLabel">Claude Code</span>
      <span id="pageLabel">Page 1 / 1</span>
    </div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <section class="course-shell" aria-live="polite">
    <div class="page" id="pageRoot"></div>
    <div class="nav">
      <button class="btn" type="button" id="prevBtn">Back</button>
      <span class="nav-center" id="navHint"></span>
      <button class="btn primary" type="button" id="nextBtn">Next</button>
    </div>
  </section>
</main>

<script>
var COURSE = {
  "id": "claude-code",
  "title": "Claude Code",
  "passingScore": 80,
  "questionsToServe": 8,
  "pages": [
    {
      "tag": "Start",
      "section": "Start",
      "title": "Claude Code",
      "body": [
        "<p>Estimated duration: 35-45 minutes Completion: scored quiz Audience: Sandvik developers and technical builders ordering Claude Code</p>",
        "<div class=\"callout\"><p>Claude can help accelerate work, but users remain responsible for what they enter, approve, share, and publish. Follow Sandvik policy, protect sensitive information, and review outputs before relying on them.</p></div>"
      ]
    },
    {
      "tag": "Overview And Audience",
      "section": "Overview And Audience",
      "title": "Overview And Audience",
      "body": [
        "<p>Claude Code is an agentic coding system for working with software projects. It can inspect codebases, propose plans, edit files, run commands, execute tests, investigate failures, and support development workflows.</p>",
        "<p>This module is for developers, technical builders, and approved users who need Claude to work inside or alongside code repositories.</p>",
        "<p>At Sandvik, Claude Code is one of the selectable tools under the Claude Enterprise license. It complements GitHub Copilot for development use cases and is intended for agentic coding workflows, advanced debugging, scripting, and complex technical work where repository and terminal access are useful.</p>",
        "<p>The central skill is not &quot;let Claude write code.&quot; The central skill is deciding what kind of engineering work this is, giving Claude enough specification and repository context, and using it inside the same quality, security, and release process you would apply to human-written code.</p>"
      ]
    },
    {
      "tag": "Learning Objectives",
      "section": "Learning Objectives",
      "title": "Learning Objectives",
      "body": [
        "<p>After this module, users should be able to:</p>",
        "<ul><li>Decide when Claude Code is the right product.</li><li>Choose the right level of process for throwaway, experimental, shared, or production-bound work.</li><li>Start with safe repository access and a clear goal.</li><li>Use plan mode or equivalent review steps to create a specification before implementation.</li><li>Use project instruction files such as <code>CLAUDE.md</code> and <code>AGENTS.md</code> effectively.</li><li>Control file changes, command execution, commits, pushes, pull requests, and releases.</li><li>Protect secrets, credentials, production data, and restricted repositories.</li><li>Use tests, code review, CI, and independent review loops as verification.</li><li>Recognize the limits of AI-written tests and AI self-review.</li><li>Apply Sandvik engineering guardrails before release.</li><li>Understand that longer or more complex Claude Code work can increase pay-as-you-go usage.</li></ul>"
      ]
    },
    {
      "tag": "How To Start Claude Code",
      "section": "How To Start Claude Code",
      "title": "How To Start Claude Code",
      "body": [
        "<p>Claude Code can be used in several surfaces, depending on Sandvik enablement and local setup:</p>",
        "<ul><li>Desktop app: open the Claude desktop app and use the Code tab where enabled.</li><li>Terminal or CLI: install Claude Code through the Sandvik-approved route, open a terminal in the repository folder, and run <code>claude</code>.</li><li>VS Code or Cursor: install the approved Claude Code extension, then use plan review and diff review before accepting changes.</li><li>JetBrains IDEs: use the approved Claude Code plugin where enabled.</li><li>Browser or web: use only if enabled by Sandvik for your work; do not treat it as the default path for repository work.</li></ul>",
        "<p>Use your Sandvik-approved Claude Enterprise account. Do not move Sandvik work into private accounts, personal API keys, or unapproved tools to avoid limits or access controls.</p>"
      ]
    },
    {
      "tag": "When To Use Claude Code",
      "section": "When To Use Claude Code",
      "title": "When To Use Claude Code",
      "body": [
        "<p>Use Claude Code when:</p>",
        "<ul><li>You need help understanding an unfamiliar codebase.</li><li>You need to implement a change across files.</li><li>You want tests, linting, or build output interpreted and fixed.</li><li>You need help with refactoring, migration, documentation, or CI failure analysis.</li><li>The work belongs in a repository and should follow engineering workflow.</li></ul>",
        "<p>Use another Claude product when:</p>",
        "<ul><li>The task is discussion, writing, or analysis without code edits: use Claude Chat.</li><li>The task is office-document or desktop workflow delegation: use Claude Cowork.</li><li>The main task is visual concept, prototype, slide, or design exploration: use Claude Design.</li></ul>"
      ]
    },
    {
      "tag": "Core Concepts",
      "section": "Core Concepts",
      "title": "1. Know Your Intent Before You Start",
      "body": [
        "<p>Before asking Claude Code to build or change something, decide what kind of work this is.</p>",
        "<table class=\"comparison\"><thead><tr><th>If the work is...</th><th>You may move faster when...</th><th>You must slow down when...</th></tr></thead><tbody><tr><td>A throwaway script, personal helper, learning exercise, or local prototype</td><td>It uses no secrets, production data, customer data, employee data, or restricted information; it will not be used by others without review; and it is clearly experimental</td><td>It starts becoming useful enough that other people may rely on it</td></tr><tr><td>Shared Sandvik software, automation, integration, or production-bound work</td><td>Claude can still help with planning, implementation, tests, and review</td><td>Other Sandvik users will rely on it; it will be maintained, reused, deployed, scheduled, or integrated; it affects production, customers, employees, suppliers, finance, safety, legal, security, identity, access, logging, retention, or compliance; or it introduces dependencies, data flows, permissions, APIs, infrastructure, or operational support needs</td></tr></tbody></table>",
        "<p>Useful questions:</p>",
        "<ul><li>Who will use this, and what happens if it is wrong?</li><li>Is this temporary, or will someone maintain it?</li><li>Which repository, owner, backlog item, or approval path applies?</li><li>What data can it access?</li><li>What test, review, documentation, and support expectations apply?</li></ul>",
        "<p>If the answer is &quot;this may be used by others,&quot; treat it as software, not as a chat output.</p>"
      ]
    },
    {
      "tag": "Core Concepts",
      "section": "Core Concepts",
      "title": "2. Specification Comes Before Implementation",
      "body": [
        "<p>Claude Code is most useful when it can execute against a clear specification. If you do not make the important decisions, Claude may fill the gaps with plausible assumptions.</p>",
        "<p>For non-trivial work, use plan mode or ask Claude to produce a specification before editing. In the CLI, plan mode can be started with <code>claude --permission-mode plan</code> or toggled during a session where supported. In IDE integrations, use the plan review flow where available.</p>",
        "<p>Good specification prompts ask for:</p>",
        "<ul><li>Goal and user need.</li><li>Non-goals.</li><li>Inputs and constraints.</li><li>Assumptions.</li><li>Decisions needed from the human owner.</li><li>Acceptance criteria.</li><li>Files or components likely affected.</li><li>Test and verification plan.</li><li>Security, privacy, dependency, or operational risks.</li><li>Open questions.</li></ul>",
        "<p>Example:</p>",
        "<pre>Use plan mode for this task.\nFirst inspect the repository and write a short specification.\nInclude goal, non-goals, users, assumptions, decisions I need to make,\nacceptance criteria, affected files, test plan, risks, and open questions.\nDo not edit files until I approve the specification.</pre>",
        "<p>Review the plan like you would review a design note. Correct the goal, remove assumptions, add missing constraints, and decide open questions before implementation starts.</p>"
      ]
    },
    {
      "tag": "Core Concepts",
      "section": "Core Concepts",
      "title": "3. Repository Context And Instruction Files Matter",
      "body": [
        "<p>Claude Code should inspect the project before changing it. Good instructions ask it to understand architecture, existing patterns, tests, and constraints.</p>",
        "<p>Example:</p>",
        "<pre>Inspect the repository and explain the relevant files before making changes.\nThen propose a short implementation plan.\nDo not edit files until I approve the plan.</pre>",
        "<p>Project instruction files reduce repeated prompting. Use them for stable information that Claude should know at the start of work:</p>",
        "<ul><li>Build, test, lint, and format commands.</li><li>Repository layout and ownership notes.</li><li>Coding conventions and architecture constraints.</li><li>Branch, commit, pull request, and review expectations.</li><li>Dependency, security, privacy, and data-handling reminders.</li><li>Known commands that must not be run without approval.</li></ul>",
        "<p>Keep instruction files short, specific, and current. &quot;Run the documented backend test command before committing&quot; is better than &quot;test carefully.&quot; If an instruction is long, conditional, or only relevant for one folder, use a linked document, scoped rule, or repeatable skill instead of putting everything into the always-loaded file.</p>",
        "<p>Claude Code reads <code>CLAUDE.md</code>. If a repository already uses <code>AGENTS.md</code> for coding-agent instructions, create a <code>CLAUDE.md</code> that imports it so the guidance is not duplicated:</p>",
        "<pre>@AGENTS.md\n</pre>"
      ]
    },
    {
      "tag": "Claude Code",
      "section": "Claude Code",
      "title": "Claude Code",
      "body": [
        "<p>Use plan mode before modifying authentication, authorization, logging, or deployment files. Do not commit, push, or open a pull request without human approval.</p>",
        "<pre>\nFiles imported with `@` syntax, such as `@AGENTS.md`, enter Claude&#x27;s context when the session starts. Large, outdated, duplicated, or conflicting imports can reduce focus and make Claude less likely to follow the most important rules. Keep imports intentional and review them when repository practices change.\n\nInstruction files guide Claude&#x27;s behavior, but they are not a hard control. Permissions, hooks, repository protections, tests, CI, code review, and Sandvik policy still matter.\n</pre>"
      ]
    },
    {
      "tag": "Claude Code",
      "section": "Claude Code",
      "title": "4. Human Approval Remains Essential",
      "body": [
        "<p>Claude Code may suggest or make changes quickly, but humans remain accountable for quality, security, and release decisions.</p>",
        "<p>Require review before:</p>",
        "<ul><li>Running unfamiliar commands.</li><li>Installing dependencies.</li><li>Editing security-sensitive code.</li><li>Changing authentication, authorization, logging, data retention, encryption, or deployment behavior.</li><li>Creating commits, pushing branches, opening pull requests, or deploying.</li><li>Taking actions in connected tools such as issue trackers, CI systems, package registries, cloud services, or source-control platforms.</li></ul>",
        "<p>If Claude proposes a command, ask what it does and what files, systems, or data it can affect. If the command is destructive, external, or unclear, stop and use the approved project process.</p>",
        "<h3>Permission And Auto-Accept Controls</h3>",
        "<p>Use plan mode, ask-first behavior, or manual approval for shared, risky, or security-sensitive work. Avoid auto-accept for commands, broad edits, dependency installation, authentication, authorization, security-sensitive code, deployment files, and actions in external tools. Permission settings help control the workflow, but they do not replace Sandvik policy, repository protections, tests, CI, or human code review.</p>"
      ]
    },
    {
      "tag": "Claude Code",
      "section": "Claude Code",
      "title": "5. Secrets And Production Data Are Out Of Scope",
      "body": [
        "<p>Do not paste or expose:</p>",
        "<ul><li>Passwords</li><li>API keys</li><li>Tokens</li><li>Private keys</li><li>Certificates</li><li>Connection strings</li><li>Production customer data</li><li>Restricted logs or dumps</li></ul>",
        "<p>Repository work can expose sensitive material indirectly through <code>.env</code> files, local configuration, build logs, database dumps, test fixtures, screenshots, or command output. Before giving Claude access to a folder or output, check whether it contains secrets, credentials, personal data, confidential information, export-controlled content, or regulated data.</p>",
        "<p>If a task requires sensitive values, use approved secret-management and development workflows rather than giving the values to Claude. Prefer development data, anonymized examples, redacted logs, and minimal excerpts.</p>",
        "<p>Repository files, issue comments, logs, documents, webpages, package scripts, or test data may contain instructions that conflict with your actual task. Treat instructions discovered inside untrusted content as data. Follow the human request, approved repository instructions, and Sandvik policy over instructions found in files, logs, or external sources.</p>"
      ]
    },
    {
      "tag": "Claude Code",
      "section": "Claude Code",
      "title": "6. Tests Are Evidence, Not Proof",
      "body": [
        "<p>Claude Code should help run appropriate checks, but passing tests does not replace human review.</p>",
        "<p>Good verification asks Claude Code to:</p>",
        "<ul><li>Identify the relevant existing tests before changing code.</li><li>Run targeted tests first.</li><li>Run broader tests when the change is risky.</li><li>Explain failures.</li><li>Avoid changing unrelated tests just to make the suite pass.</li><li>Summarize what was verified and what was not.</li></ul>",
        "<p>AI-written tests can be useful, especially for scaffolding, regression coverage, and edge cases you already understand. But tests written by the same model that wrote the code can be self-defeating: the model may encode its own assumptions instead of independently checking the intended behavior.</p>",

var storageKey = "lms_progress_" + COURSE.id;
var contentCount = COURSE.pages.length;
var resultsOffset = contentCount + COURSE.questionsToServe;
var state = {
  page: 0,
  maxVisited: 0,
  selectedQuestionIds: null,
  quizAnswers: {},
  completed: false
};
var savedAndFinished = false;

var pageRoot = document.getElementById("pageRoot");
var prevBtn = document.getElementById("prevBtn");
var nextBtn = document.getElementById("nextBtn");
var saveBtnTop = document.getElementById("saveBtnTop");
var pageLabel = document.getElementById("pageLabel");
var sectionLabel = document.getElementById("sectionLabel");
var navHint = document.getElementById("navHint");
var progressDots = document.getElementById("progressDots");
var moduleStatus = document.getElementById("moduleStatus");

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function shuffle(items) {
  var copy = items.slice();
  for (var i = copy.length - 1; i > 0; i -= 1) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

function selectQuestions() {
  return shuffle(COURSE.quizBank.map(function(question) { return question.id; })).slice(0, COURSE.questionsToServe);
}

function getQuestionById(id) {
  for (var i = 0; i < COURSE.quizBank.length; i += 1) {
    if (COURSE.quizBank[i].id === id) return COURSE.quizBank[i];
  }
  return null;
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function saveLocal() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (error) {}
}

function restoreState(saved) {
  if (!saved) return;
  if (typeof saved.page === "number") state.page = saved.page;
  if (typeof saved.maxVisited === "number") state.maxVisited = saved.maxVisited;
  if (Array.isArray(saved.selectedQuestionIds)) state.selectedQuestionIds = saved.selectedQuestionIds;
  if (saved.quizAnswers && typeof saved.quizAnswers === "object") state.quizAnswers = saved.quizAnswers;
  if (typeof saved.completed === "boolean") state.completed = saved.completed;
}

function persist() {
  SCORM.setPage(state.page);
  SCORM.saveSuspendData(state);
  saveLocal();
}

function ensureQuestions() {
  if (!Array.isArray(state.selectedQuestionIds) || state.selectedQuestionIds.length !== COURSE.questionsToServe) {
    state.selectedQuestionIds = selectQuestions();
    state.quizAnswers = {};
  }
}

function getTotalPages() {
  return contentCount + COURSE.questionsToServe + 1;
}

function getCurrentQuestionIndex() {
  return state.page - contentCount;
}

function isQuizPage() {
  return state.page >= contentCount && state.page < resultsOffset;
}

function isResultsPage() {
  return state.page === resultsOffset;
}

function allQuizAnswered() {
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    if (!state.quizAnswers[state.selectedQuestionIds[i]]) return false;
  }
  return true;
}

function answeredCurrentQuestion() {
  if (!isQuizPage()) return true;
  var questionId = state.selectedQuestionIds[getCurrentQuestionIndex()];
  return Boolean(state.quizAnswers[questionId]);
}

function escapeText(text) {
  var span = document.createElement("span");
  span.textContent = text;
  return span.innerHTML;
}

function renderContentPage(page) {
  var html = '<span class="page-tag">' + escapeText(page.tag) + '</span>';
  html += '<h1>' + escapeText(page.title) + '</h1>';
  html += page.body.join("");
  pageRoot.innerHTML = html;
}

function renderQuizPage(questionIndex) {
  var questionId = state.selectedQuestionIds[questionIndex];
  var question = getQuestionById(questionId);
  var saved = state.quizAnswers[questionId];
  var optionKeys = ["A", "B", "C", "D"];
  var html = '<span class="page-tag">Knowledge Check ' + (questionIndex + 1) + ' of ' + COURSE.questionsToServe + '</span>';
  html += '<h1>' + escapeText(question.prompt) + '</h1>';
  html += '<p class="lede">Choose the best answer. Feedback appears immediately after your selection.</p>';
  html += '<div class="quiz-options" role="group" aria-label="Answer options">';
  optionKeys.forEach(function(key) {
    var classes = "quiz-option";
    if (saved) {
      if (key === question.answer) classes += " correct";
      else if (key === saved.selected) classes += " wrong";
    }
    html += '<button class="' + classes + '" type="button" data-option="' + key + '"' + (saved ? " disabled" : "") + '><strong>' + key + '.</strong> ' + escapeText(question.options[key]) + '</button>';
  });
  html += '</div>';
  html += '<div class="feedback' + (saved ? " show " + (saved.correct ? "correct" : "wrong") : "") + '" id="feedbackBox">' + (saved ? escapeText(saved.correct ? question.correct : question.incorrect) : "") + '</div>';
  pageRoot.innerHTML = html;

  var buttons = pageRoot.querySelectorAll(".quiz-option");
  for (var i = 0; i < buttons.length; i += 1) {
    buttons[i].addEventListener("click", function(event) {
      answerQuestion(question, event.currentTarget.getAttribute("data-option"));
    });
  }
}

function calculateScore() {
  var correctCount = 0;
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    if (answer && answer.correct) correctCount += 1;
  }
  return Math.round((correctCount / COURSE.questionsToServe) * 100);
}

function renderResultsPage() {
  var score = calculateScore();
  var passed = score >= COURSE.passingScore;
  state.completed = passed;
  var html = '<span class="page-tag">Results</span>';
  html += '<h1>Your results</h1>';
  html += '<div class="score">' + score + '%</div>';
  html += '<p class="lede">' + (passed ? "Passed. You have met the 80% requirement for this module." : "Not yet passed. Review the module and retake the quiz when ready.") + '</p>';
  html += '<div class="score-bar" aria-label="Quiz result by question">';
  for (var i = 0; i < state.selectedQuestionIds.length; i += 1) {
    var answer = state.quizAnswers[state.selectedQuestionIds[i]];
    html += '<span class="score-segment ' + (answer && answer.correct ? "ok" : "fail") + '"></span>';
  }
  html += '</div>';
  html += "<div class=\"grid\"><div class=\"panel\"><h3>Completion</h3><p>If this course is running in an LMS, your score is sent when you view this page.</p></div><div class=\"panel\"><h3>Next action</h3><p>You can retake the quiz as needed.</p><button class=\"btn\" type=\"button\" id=\"retryBtn\">Retake quiz</button></div></div>";
  pageRoot.innerHTML = html;
  document.getElementById("retryBtn").addEventListener("click", retakeQuiz);
  SCORM.complete(score, passed);
  persist();
}

function renderProgress() {
  var totalPages = getTotalPages();
  var html = "";
  for (var i = 0; i < totalPages; i += 1) {
    var label = "Page " + (i + 1);
    var classes = "progress-dot";
    if (i === state.page) classes += " active";
    else if (i <= state.maxVisited) classes += " visited";
    html += '<button class="' + classes + '" type="button" data-page="' + i + '" aria-label="' + label + '"' + (i <= state.maxVisited ? "" : " disabled") + '><span class="sr-only">' + label + '</span></button>';
  }
  progressDots.innerHTML = html;
  var dots = progressDots.querySelectorAll(".progress-dot");
  for (var d = 0; d < dots.length; d += 1) {
    dots[d].addEventListener("click", function(event) {
      var page = parseInt(event.currentTarget.getAttribute("data-page"), 10);
      if (page <= state.maxVisited) goToPage(page);
    });
  }
}

function render() {
  ensureQuestions();
  var totalPages = getTotalPages();
  if (state.page < 0) state.page = 0;
  if (state.page >= totalPages) state.page = totalPages - 1;
  state.maxVisited = Math.max(state.maxVisited, state.page);

  if (state.page < contentCount) {
    renderContentPage(COURSE.pages[state.page]);
    sectionLabel.textContent = COURSE.pages[state.page].section;
  } else if (isQuizPage()) {
    renderQuizPage(getCurrentQuestionIndex());
    sectionLabel.textContent = "Knowledge Check";
  } else {
    renderResultsPage();
    sectionLabel.textContent = "Results";
  }

  pageLabel.textContent = "Page " + (state.page + 1) + " / " + totalPages;
  navHint.textContent = isQuizPage() && !answeredCurrentQuestion() ? "Answer this question to continue." : "";
  prevBtn.disabled = state.page === 0;
  nextBtn.style.display = isResultsPage() ? "none" : "";
  nextBtn.textContent = state.page === totalPages - 2 ? "See results" : "Next";
  nextBtn.disabled = isQuizPage() && !answeredCurrentQuestion();
  moduleStatus.textContent = state.completed ? "Passed" : "Not completed";
  renderProgress();
  persist();
}

function goToPage(page) {
  state.page = page;
  render();
  window.scrollTo(0, 0);
}

function navigate(direction) {
  var nextPage = state.page + direction;
  if (nextPage < 0 || nextPage >= getTotalPages()) return;
  if (direction > 0 && isQuizPage() && !answeredCurrentQuestion()) return;
  if (nextPage === resultsOffset && !allQuizAnswered()) return;
  goToPage(nextPage);
}

function answerQuestion(question, selected) {
  if (state.quizAnswers[question.id]) return;
  var correct = selected === question.answer;
  state.quizAnswers[question.id] = { selected: selected, correct: correct };
  renderQuizPage(getCurrentQuestionIndex());
  nextBtn.disabled = false;
  navHint.textContent = "";
  persist();
}

function saveLater() {
  persist();
  SCORM.finish();
  savedAndFinished = true;
  pageRoot.innerHTML = '<span class="page-tag">Saved</span><h1>Your progress has been saved</h1><p class="lede">Next time you open this course in the same LMS or browser, you should continue from page ' + (state.page + 1) + '.</p>';
  prevBtn.style.display = "none";
  nextBtn.style.display = "none";
  navHint.textContent = "You can close this window.";
}

function retakeQuiz() {
  state.selectedQuestionIds = selectQuestions();
  state.quizAnswers = {};
  state.completed = false;
  state.page = contentCount;
  state.maxVisited = contentCount;
  render();
}

prevBtn.addEventListener("click", function() { navigate(-1); });
nextBtn.addEventListener("click", function() { navigate(1); });
saveBtnTop.addEventListener("click", saveLater);

window.addEventListener("beforeunload", function() {
  if (!savedAndFinished) SCORM.finish();
});

var scormBookmark = SCORM.init();
var suspended = SCORM.getSuspendData();
restoreState(suspended || loadLocal());
if (!suspended && scormBookmark && !state.page) state.page = scormBookmark;
ensureQuestions();
render();
</script>
</body>
</html>
