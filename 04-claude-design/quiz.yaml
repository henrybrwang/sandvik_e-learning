module_id: "claude-design"
title: "Claude Design"
version: "0.1"
language: "en"
recommended_duration_minutes: 30
passing_score: 80
question_bank_size: 12
questions_to_serve: 8
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "design-q01"
    type: "multiple_choice"
    prompt: "What should a strong Claude Design prompt include?"
    options:
      - key: "A"
        text: "Only make it look nice."
      - key: "B"
        text: "Audience, purpose, format, content, brand constraints, accessibility needs, and review expectations."
      - key: "C"
        text: "Permission to invent Sandvik assets."
      - key: "D"
        text: "A request to skip brand review."
  - id: "design-q02"
    type: "multiple_choice"
    prompt: "How should generated visual work be treated?"
    options:
      - key: "A"
        text: "As approved final material."
      - key: "B"
        text: "As a draft until reviewed by the right owners."
      - key: "C"
        text: "As automatically external-ready."
      - key: "D"
        text: "As exempt from legal review."
  - id: "design-q03"
    type: "multiple_choice"
    prompt: "What should Claude Design do when approved Sandvik brand assets are missing?"
    options:
      - key: "A"
        text: "Invent a similar logo."
      - key: "B"
        text: "Use a competitor's style."
      - key: "C"
        text: "Mark the missing item as a brand placeholder."
      - key: "D"
        text: "Publish without the asset."
  - id: "design-q04"
    type: "multiple_choice"
    prompt: "What is a key IP risk in visual design work?"
    options:
      - key: "A"
        text: "Using third-party images, icons, logos, or references without approval."
      - key: "B"
        text: "Using clear headings."
      - key: "C"
        text: "Adding alt text."
      - key: "D"
        text: "Flagging missing sources."
  - id: "design-q05"
    type: "multiple_choice"
    prompt: "What is the safest approach to screenshots of internal systems?"
    options:
      - key: "A"
        text: "Use them freely if the design is internal."
      - key: "B"
        text: "Check policy, remove sensitive information, and use approved placeholders when needed."
      - key: "C"
        text: "Blur one corner and assume it is safe."
      - key: "D"
        text: "Post them externally for feedback."
  - id: "design-q06"
    type: "multiple_choice"
    prompt: "Which accessibility instruction is best?"
    options:
      - key: "A"
        text: "Use color alone to show status."
      - key: "B"
        text: "Use readable contrast, clear headings, and do not rely on color alone."
      - key: "C"
        text: "Use tiny text to fit more content."
      - key: "D"
        text: "Skip accessibility for drafts."
  - id: "design-q07"
    type: "multiple_choice"
    prompt: "When should a Claude Design output be handed off to Claude Code or a development team?"
    options:
      - key: "A"
        text: "When the prototype needs production implementation, testing, or repository work."
      - key: "B"
        text: "When the task is only a visual brainstorm."
      - key: "C"
        text: "When no code is needed."
      - key: "D"
        text: "When brand review is skipped."
  - id: "design-q08"
    type: "multiple_choice"
    prompt: "What is required before publishing generated Sandvik-branded material externally?"
    options:
      - key: "A"
        text: "Brand and Legal review according to Sandvik rules."
      - key: "B"
        text: "Only a nice-looking final design."
      - key: "C"
        text: "A prompt asking Claude to approve it."
      - key: "D"
        text: "No review if the content is short."
  - id: "design-q09"
    type: "multiple_choice"
    prompt: "Which task is the best fit for Claude Design?"
    options:
      - key: "A"
        text: "Creating a visual prototype or one-pager concept."
      - key: "B"
        text: "Running repository tests."
      - key: "C"
        text: "Autonomously editing local folders."
      - key: "D"
        text: "Making a legal decision."
  - id: "design-q10"
    type: "multiple_choice"
    prompt: "A slide concept includes business numbers that were not in the source. What should happen?"
    options:
      - key: "A"
        text: "Publish it if the slide looks professional."
      - key: "B"
        text: "Verify, source, or remove the numbers before use."
      - key: "C"
        text: "Make the numbers smaller so they matter less."
      - key: "D"
        text: "Ask Claude to make them sound precise."
  - id: "design-q11"
    type: "multiple_choice"
    prompt: "How should export formats and storage locations be handled?"
    options:
      - key: "A"
        text: "Use approved formats and storage locations defined by Sandvik."
      - key: "B"
        text: "Use any public file-sharing link."
      - key: "C"
        text: "Store drafts wherever convenient."
      - key: "D"
        text: "Email all versions externally."
  - id: "design-q12"
    type: "multiple_choice"
    prompt: "Because Claude Design was source-checked as a research-preview product, what should the team do before publishing training?"
    options:
      - key: "A"
        text: "Recheck availability, eligibility, and current product behavior."
      - key: "B"
        text: "Assume the product will never change."
      - key: "C"
        text: "Remove all review requirements."
      - key: "D"
        text: "Use only unofficial descriptions."
answers:
  design-q01: "B"
  design-q02: "B"
  design-q03: "C"
  design-q04: "A"
  design-q05: "B"
  design-q06: "B"
  design-q07: "A"
  design-q08: "A"
  design-q09: "A"
  design-q10: "B"
  design-q11: "A"
  design-q12: "A"
feedback:
  design-q01:
    correct: "Correct. A visual brief needs audience, purpose, constraints, and review expectations."
    incorrect: "Claude Design works best with a clear visual brief."
  design-q02:
    correct: "Correct. Generated visual material is a draft until approved."
    incorrect: "Design outputs still need appropriate review."
  design-q03:
    correct: "Correct. Missing approved assets should be marked as placeholders."
    incorrect: "Do not invent Sandvik brand assets."
  design-q04:
    correct: "Correct. Third-party material needs approval."
    incorrect: "IP risk often comes from unapproved external assets or references."
  design-q05:
    correct: "Correct. Screenshots can expose sensitive systems or data."
    incorrect: "Internal screenshots still require policy and sensitivity review."
  design-q06:
    correct: "Correct. Accessibility matters in drafts and final work."
    incorrect: "Readable contrast and non-color cues help global users."
  design-q07:
    correct: "Correct. Production implementation belongs in engineering workflow."
    incorrect: "Design concepts are not a replacement for tested production work."
  design-q08:
    correct: "Correct. External publication requires Brand and Legal review."
    incorrect: "Generated branded content is not automatically approved."
  design-q09:
    correct: "Correct. Claude Design is for visual concepts and prototypes."
    incorrect: "Choose the Claude product that matches the main work."
  design-q10:
    correct: "Correct. Numbers and claims must be sourced or removed."
    incorrect: "Professional visual design does not make unsupported facts safe."
  design-q11:
    correct: "Correct. Exports and storage must follow Sandvik rules."
    incorrect: "Generated files may contain sensitive or brand-controlled material."
  design-q12:
    correct: "Correct. New or preview products need a source recheck before launch."
    incorrect: "Availability and behavior can change, so recheck official sources."
