module_id: "claude-design"
title: "Claude Design"
version: "0.1"
language: "en"
recommended_duration_minutes: 30
passing_score: 80
question_bank_size: 12
questions_to_serve: 8
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "design-q01"
    type: "multiple_choice"
    prompt: "A colleague asks Claude Design to make a one-pager from a rough idea. What should happen before visual work starts?"
    options:
      - key: "A"
        text: "Clarify the audience, purpose, source material, format, constraints, and required review."
      - key: "B"
        text: "Generate a polished version first, then decide who it is for."
      - key: "C"
        text: "Use any Sandvik-looking layout because it is only an internal draft."
      - key: "D"
        text: "Ask Claude to invent missing facts so the design feels complete."
  - id: "design-q02"
    type: "multiple_choice"
    prompt: "A source folder contains useful notes, an old logo, customer screenshots, and unrelated files. What is the best preparation step?"
    options:
      - key: "A"
        text: "Upload the whole folder so Claude has maximum context."
      - key: "B"
        text: "Keep only approved relevant sources, remove sensitive or unrelated material, and mark missing assets as placeholders."
      - key: "C"
        text: "Use the old logo if it makes the draft easier to understand."
      - key: "D"
        text: "Blur the customer screenshots and treat them as approved."
  - id: "design-q03"
    type: "multiple_choice"
    prompt: "Which prompt is the strongest visual brief?"
    options:
      - key: "A"
        text: "Make this look modern and professional for Sandvik."
      - key: "B"
        text: "Create something visual from these notes and choose the best format."
      - key: "C"
        text: "Create an internal slide concept for regional managers, using only the supplied notes, approved assets or placeholders, clear contrast, and a list of facts to verify."
      - key: "D"
        text: "Create a finished external presentation and make it match Sandvik brand automatically."
  - id: "design-q04"
    type: "multiple_choice"
    prompt: "A user wants to compare design options before choosing one. Which instruction best matches the module workflow?"
    options:
      - key: "A"
        text: "Create three distinct directions, describe strengths and risks, and do not finalize the design yet."
      - key: "B"
        text: "Create ten complete versions and export all of them."
      - key: "C"
        text: "Choose one design direction without showing alternatives."
      - key: "D"
        text: "Copy the style of a public competitor example as closely as possible."
  - id: "design-q05"
    type: "multiple_choice"
    prompt: "During refinement, the first draft is too dense for global business users. Which feedback is most useful?"
    options:
      - key: "A"
        text: "Make it better and more premium."
      - key: "B"
        text: "Keep all content, but make the text smaller."
      - key: "C"
        text: "Simplify the wording, reduce the sections, and make the required user action visible first."
      - key: "D"
        text: "Add more visual effects so the audience pays attention."
  - id: "design-q06"
    type: "multiple_choice"
    prompt: "A slide concept includes business numbers that were not in the source material. What should the user do?"
    options:
      - key: "A"
        text: "Keep the numbers if they are clearly labeled in the design."
      - key: "B"
        text: "Ask Claude to estimate the numbers based on similar projects."
      - key: "C"
        text: "Verify, source, remove, or mark the numbers as [CHECK REQUIRED] before use."
      - key: "D"
        text: "Move the numbers to speaker notes so they are less visible."
  - id: "design-q07"
    type: "multiple_choice"
    prompt: "A prototype needs screenshots from an internal system, but screenshot rules are not finalized. What is the safest approach?"
    options:
      - key: "A"
        text: "Use real screenshots because the prototype is for internal review."
      - key: "B"
        text: "Use [SCREENSHOT PLACEHOLDER], remove unnecessary sensitive details, and wait for approved screenshot guidance."
      - key: "C"
        text: "Use screenshots only after cropping out the browser toolbar."
      - key: "D"
        text: "Export the prototype first and review screenshot policy later."
  - id: "design-q08"
    type: "multiple_choice"
    prompt: "Which review finding is an accessibility issue?"
    options:
      - key: "A"
        text: "The draft uses approved placeholders for missing logos."
      - key: "B"
        text: "A status chart communicates meaning by color only."
      - key: "C"
        text: "The final slide lists facts that need verification."
      - key: "D"
        text: "The design is labeled as an internal draft."
  - id: "design-q09"
    type: "multiple_choice"
    prompt: "A team wants to share a Claude Design draft after review. What must they check first?"
    options:
      - key: "A"
        text: "Approved export format, storage location, sharing scope, metadata, sensitive content, and draft or approval status."
      - key: "B"
        text: "Only whether the file opens correctly."
      - key: "C"
        text: "Whether any public file-sharing link is faster."
      - key: "D"
        text: "Whether the design looks finished enough to skip labeling."
  - id: "design-q10"
    type: "multiple_choice"
    prompt: "When should a Claude Design prototype be handed off to Claude Code or a development team?"
    options:
      - key: "A"
        text: "When the prototype needs production implementation, tests, repository work, or engineering review."
      - key: "B"
        text: "Whenever the user dislikes the first visual direction."
      - key: "C"
        text: "Only after external publication."
      - key: "D"
        text: "When Brand review has not happened."
  - id: "design-q11"
    type: "multiple_choice"
    prompt: "Because Claude Design is source-checked as research preview and Enterprise admin-controlled, what should be confirmed before publishing training?"
    options:
      - key: "A"
        text: "Current availability, Sandvik enablement, approved settings, and product behavior."
      - key: "B"
        text: "That every user can enable it individually without approval."
      - key: "C"
        text: "That all export and sharing routes are automatically approved."
      - key: "D"
        text: "That preview products do not need review notes."
  - id: "design-q12"
    type: "multiple_choice"
    prompt: "A user is generating many visual variants with large files and repeated exports. What is the best cost-aware habit?"
    options:
      - key: "A"
        text: "Keep iterating until every possible direction has been explored."
      - key: "B"
        text: "Limit directions, choose before deep refinement, reuse approved templates, and request higher monthly usage or spending approval if business needs justify it."
      - key: "C"
        text: "Move the work to a private account if plan limits slow the task."
      - key: "D"
        text: "Avoid checking usage because design exploration is included in the base fee."
answers:
  design-q01: "A"
  design-q02: "B"
  design-q03: "C"
  design-q04: "A"
  design-q05: "C"
  design-q06: "C"
  design-q07: "B"
  design-q08: "B"
  design-q09: "A"
  design-q10: "A"
  design-q11: "A"
  design-q12: "B"
feedback:
  design-q01:
    correct: "Correct. Visual work should start with purpose, audience, sources, constraints, and review expectations."
    incorrect: "Start with a clear brief before generating design work."
  design-q02:
    correct: "Correct. Use the smallest approved source set and mark missing assets as placeholders."
    incorrect: "Source preparation should reduce unnecessary exposure and avoid unapproved assets."
  design-q03:
    correct: "Correct. The prompt gives audience, source boundaries, brand controls, accessibility, and verification needs."
    incorrect: "A strong visual brief is specific about audience, sources, constraints, and review."
  design-q04:
    correct: "Correct. Exploration should compare options before committing to a final draft."
    incorrect: "The module recommends a limited number of distinct directions with risks and tradeoffs."
  design-q05:
    correct: "Correct. Specific feedback helps Claude improve the design for the actual audience."
    incorrect: "Refinement works best when the user names the problem and desired change."
  design-q06:
    correct: "Correct. Unsupported numbers must be verified, sourced, removed, or clearly marked."
    incorrect: "Professional visual design does not make unsupported facts safe."
  design-q07:
    correct: "Correct. Use placeholders and wait for approved screenshot guidance when rules are not final."
    incorrect: "Internal screenshots can still expose sensitive systems or data."
  design-q08:
    correct: "Correct. Do not rely on color alone to communicate meaning."
    incorrect: "Accessibility includes readable structure and non-color cues."
  design-q09:
    correct: "Correct. Export and sharing checks include format, location, scope, sensitivity, metadata, and status."
    incorrect: "Generated files may contain sensitive or brand-controlled material."
  design-q10:
    correct: "Correct. Production implementation belongs in an engineering workflow."
    incorrect: "A prototype is not a substitute for tested production work."
  design-q11:
    correct: "Correct. Preview and admin-controlled products need a source and enablement recheck before launch."
    incorrect: "Availability, settings, and approved behavior can change."
  design-q12:
    correct: "Correct. Focused exploration and approved spending-limit requests help manage usage."
    incorrect: "Repeated visual exploration can increase pay-as-you-go usage."
