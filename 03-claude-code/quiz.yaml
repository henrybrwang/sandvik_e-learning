module_id: "claude-code"
title: "Claude Code"
version: "0.1"
language: "en"
recommended_duration_minutes: 35
passing_score: 80
question_bank_size: 12
questions_to_serve: 8
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "code-q01"
    type: "multiple_choice"
    prompt: "What should Claude Code usually do before editing files?"
    options:
      - key: "A"
        text: "Inspect the repository and propose a short plan."
      - key: "B"
        text: "Rewrite the project immediately."
      - key: "C"
        text: "Delete failing tests."
      - key: "D"
        text: "Commit changes before showing a diff."
  - id: "code-q02"
    type: "multiple_choice"
    prompt: "Which information should not be pasted into Claude Code?"
    options:
      - key: "A"
        text: "A public function name."
      - key: "B"
        text: "A test failure message with no sensitive data."
      - key: "C"
        text: "Passwords, API keys, tokens, private keys, or production secrets."
      - key: "D"
        text: "A non-sensitive feature description."
  - id: "code-q03"
    type: "multiple_choice"
    prompt: "Claude Code wants to run an unfamiliar command. What should happen?"
    options:
      - key: "A"
        text: "Run it without review because commands are always safe."
      - key: "B"
        text: "Review the command purpose and impact before approving."
      - key: "C"
        text: "Ask Claude to hide command output."
      - key: "D"
        text: "Run it only in production first."
  - id: "code-q04"
    type: "multiple_choice"
    prompt: "What is the role of tests when using Claude Code?"
    options:
      - key: "A"
        text: "Tests help verify behavior, but do not replace human review."
      - key: "B"
        text: "Tests are unnecessary if Claude explains the change."
      - key: "C"
        text: "Only failing tests should be deleted."
      - key: "D"
        text: "Tests should be skipped for small changes."
  - id: "code-q05"
    type: "multiple_choice"
    prompt: "What is the safest default Git behavior?"
    options:
      - key: "A"
        text: "Commit and push every change automatically."
      - key: "B"
        text: "Review diffs and require approval before commit, push, pull request, or deployment."
      - key: "C"
        text: "Work directly on the main branch."
      - key: "D"
        text: "Merge if Claude says tests pass."
  - id: "code-q06"
    type: "multiple_choice"
    prompt: "How should production data be treated?"
    options:
      - key: "A"
        text: "Use it freely to help Claude debug."
      - key: "B"
        text: "Avoid exposing it; use approved anonymized or development data where possible."
      - key: "C"
        text: "Paste it only if the issue is urgent."
      - key: "D"
        text: "Put it in comments and delete later."
  - id: "code-q07"
    type: "multiple_choice"
    prompt: "A test suite passes after Claude Code changes security-sensitive code. What is still needed?"
    options:
      - key: "A"
        text: "No further review."
      - key: "B"
        text: "Human code review and any required security review."
      - key: "C"
        text: "Immediate deployment."
      - key: "D"
        text: "Removal of security notes."
  - id: "code-q08"
    type: "multiple_choice"
    prompt: "What should you do if Claude Code changes unrelated files during a small task?"
    options:
      - key: "A"
        text: "Review the diff, challenge the scope, and remove or reject unrelated changes."
      - key: "B"
        text: "Accept all changes to save time."
      - key: "C"
        text: "Ask Claude to change more files for consistency."
      - key: "D"
        text: "Commit without review."
  - id: "code-q09"
    type: "multiple_choice"
    prompt: "What is a good first step for a CI failure?"
    options:
      - key: "A"
        text: "Ask Claude Code to identify the root cause from logs and relevant files."
      - key: "B"
        text: "Disable the CI job."
      - key: "C"
        text: "Delete tests that failed."
      - key: "D"
        text: "Merge anyway."
  - id: "code-q10"
    type: "multiple_choice"
    prompt: "When is Claude Chat more appropriate than Claude Code?"
    options:
      - key: "A"
        text: "When the task is discussion, drafting, or analysis without repository changes."
      - key: "B"
        text: "When tests must be run."
      - key: "C"
        text: "When code must be committed."
      - key: "D"
        text: "When a branch needs a pull request."
  - id: "code-q11"
    type: "multiple_choice"
    prompt: "Claude Code suggests adding a new open-source dependency. What should happen?"
    options:
      - key: "A"
        text: "Add it immediately because it saves time."
      - key: "B"
        text: "Follow Sandvik dependency, security, and license review rules."
      - key: "C"
        text: "Hide it in the lockfile."
      - key: "D"
        text: "Use any license if the package is popular."
  - id: "code-q12"
    type: "multiple_choice"
    prompt: "Who remains accountable for code quality and release decisions?"
    options:
      - key: "A"
        text: "Claude Code alone."
      - key: "B"
        text: "The human users and Sandvik's approved engineering process."
      - key: "C"
        text: "The package manager."
      - key: "D"
        text: "The test runner only."
answers:
  code-q01: "A"
  code-q02: "C"
  code-q03: "B"
  code-q04: "A"
  code-q05: "B"
  code-q06: "B"
  code-q07: "B"
  code-q08: "A"
  code-q09: "A"
  code-q10: "A"
  code-q11: "B"
  code-q12: "B"
feedback:
  code-q01:
    correct: "Correct. Inspect first, then plan."
    incorrect: "Claude Code should understand the repository before editing."
  code-q02:
    correct: "Correct. Secrets and credentials must not be exposed."
    incorrect: "Never paste passwords, keys, tokens, or production secrets."
  code-q03:
    correct: "Correct. Commands need impact review before approval."
    incorrect: "Unfamiliar commands may modify files, systems, or data."
  code-q04:
    correct: "Correct. Tests support verification but do not replace review."
    incorrect: "Use tests and human review together."
  code-q05:
    correct: "Correct. Git actions should remain controlled."
    incorrect: "Review diffs and get approval before Git or deployment actions."
  code-q06:
    correct: "Correct. Use approved anonymized or development data."
    incorrect: "Production data must be protected."
  code-q07:
    correct: "Correct. Security-sensitive code still needs human review."
    incorrect: "Passing tests are not a full security review."
  code-q08:
    correct: "Correct. Keep scope tight and review diffs."
    incorrect: "Unrelated changes create risk and should be challenged."
  code-q09:
    correct: "Correct. Start with root-cause analysis."
    incorrect: "Do not disable or delete tests before understanding the failure."
  code-q10:
    correct: "Correct. Chat is appropriate when no repository work is needed."
    incorrect: "Claude Code is for repository and development workflows."
  code-q11:
    correct: "Correct. Dependencies require policy, security, and license review."
    incorrect: "New dependencies can create security and license risk."
  code-q12:
    correct: "Correct. Humans and approved processes remain accountable."
    incorrect: "Claude Code assists but does not own release accountability."
