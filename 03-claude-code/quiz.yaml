module_id: "claude-code"
title: "Claude Code"
version: "0.2"
language: "en"
recommended_duration_minutes: 40
passing_score: 80
question_bank_size: 12
questions_to_serve: 8
retakes: "unlimited"
randomize_questions: true
policy_review_required: true
questions:
  - id: "code-q01"
    type: "multiple_choice"
    prompt: "What should Claude Code usually do before implementing a non-trivial change?"
    options:
      - key: "A"
        text: "Inspect the repository and write a plan or specification for review."
      - key: "B"
        text: "Rewrite the project immediately."
      - key: "C"
        text: "Delete failing tests first."
      - key: "D"
        text: "Commit changes before showing a diff."
  - id: "code-q02"
    type: "multiple_choice"
    prompt: "Which information should not be pasted into Claude Code?"
    options:
      - key: "A"
        text: "A public function name."
      - key: "B"
        text: "A test failure message with no sensitive data."
      - key: "C"
        text: "Passwords, API keys, tokens, private keys, certificates, connection strings, or production secrets."
      - key: "D"
        text: "A non-sensitive feature description."
  - id: "code-q03"
    type: "multiple_choice"
    prompt: "Claude Code wants to run an unfamiliar command. What should happen?"
    options:
      - key: "A"
        text: "Run it without review because commands are always safe."
      - key: "B"
        text: "Review the command purpose, impact, affected files, and affected systems before approving."
      - key: "C"
        text: "Ask Claude to hide command output."
      - key: "D"
        text: "Run it only in production first."
  - id: "code-q04"
    type: "multiple_choice"
    prompt: "What is a good way to treat tests written by the same AI model that wrote the code?"
    options:
      - key: "A"
        text: "Use them as useful scaffolding, but review whether they prove the intended behavior."
      - key: "B"
        text: "Treat them as independent proof that the code is correct."
      - key: "C"
        text: "Use only AI-written tests and skip existing tests."
      - key: "D"
        text: "Delete them after the suite passes."
  - id: "code-q05"
    type: "multiple_choice"
    prompt: "What is the safest default Git behavior?"
    options:
      - key: "A"
        text: "Commit and push every change automatically."
      - key: "B"
        text: "Review diffs and require approval before commit, push, pull request, or deployment."
      - key: "C"
        text: "Work directly on the main branch."
      - key: "D"
        text: "Merge if Claude says tests pass."
  - id: "code-q06"
    type: "multiple_choice"
    prompt: "Why should you decide whether work is throwaway, experimental, shared, or production-bound before using Claude Code?"
    options:
      - key: "A"
        text: "Because shared or production-bound work requires normal engineering process, review, tests, and approvals."
      - key: "B"
        text: "Because throwaway scripts never need any data checks."
      - key: "C"
        text: "Because Claude Code cannot work on prototypes."
      - key: "D"
        text: "Because intent only affects the color theme."
  - id: "code-q07"
    type: "multiple_choice"
    prompt: "A test suite passes after Claude Code changes security-sensitive code. What is still needed?"
    options:
      - key: "A"
        text: "No further review."
      - key: "B"
        text: "Human code review and any required security review."
      - key: "C"
        text: "Immediate deployment."
      - key: "D"
        text: "Removal of security notes."
  - id: "code-q08"
    type: "multiple_choice"
    prompt: "How should a repository that already uses AGENTS.md make those instructions available to Claude Code?"
    options:
      - key: "A"
        text: "Create a concise CLAUDE.md that imports AGENTS.md and adds Claude-specific guidance where needed."
      - key: "B"
        text: "Copy every project document into every prompt."
      - key: "C"
        text: "Rely on Claude to guess repository rules from file names."
      - key: "D"
        text: "Put secrets and production credentials in AGENTS.md so Claude can run everything."
  - id: "code-q09"
    type: "multiple_choice"
    prompt: "What is a good first step for a CI failure?"
    options:
      - key: "A"
        text: "Ask Claude Code to identify the root cause from logs and relevant files."
      - key: "B"
        text: "Disable the CI job."
      - key: "C"
        text: "Delete tests that failed."
      - key: "D"
        text: "Merge anyway."
  - id: "code-q10"
    type: "multiple_choice"
    prompt: "Which setup is appropriate for Sandvik work with Claude Code?"
    options:
      - key: "A"
        text: "Use the Sandvik-approved Enterprise account and approved desktop, terminal, or IDE setup."
      - key: "B"
        text: "Use a private account to avoid Sandvik limits."
      - key: "C"
        text: "Paste Sandvik repository data into any public coding tool."
      - key: "D"
        text: "Use personal API keys for Sandvik work by default."
  - id: "code-q11"
    type: "multiple_choice"
    prompt: "Claude Code suggests adding a new open-source dependency. What should happen?"
    options:
      - key: "A"
        text: "Add it immediately because it saves time."
      - key: "B"
        text: "Follow Sandvik dependency, security, and license review rules."
      - key: "C"
        text: "Hide it in the lockfile."
      - key: "D"
        text: "Use any license if the package is popular."
  - id: "code-q12"
    type: "multiple_choice"
    prompt: "Why are review loops useful when working with Claude Code?"
    options:
      - key: "A"
        text: "They help catch bad assumptions in plans, diffs, tests, security impact, and CI fixes before release."
      - key: "B"
        text: "They replace human accountability."
      - key: "C"
        text: "They allow deployment without review."
      - key: "D"
        text: "They make secrets safe to paste."
answers:
  code-q01: "A"
  code-q02: "C"
  code-q03: "B"
  code-q04: "A"
  code-q05: "B"
  code-q06: "A"
  code-q07: "B"
  code-q08: "A"
  code-q09: "A"
  code-q10: "A"
  code-q11: "B"
  code-q12: "A"
feedback:
  code-q01:
    correct: "Correct. Inspect first, then review the plan or specification before implementation."
    incorrect: "Claude Code should understand the repository and produce a reviewable plan before non-trivial edits."
  code-q02:
    correct: "Correct. Secrets and credentials must not be exposed."
    incorrect: "Never paste passwords, keys, tokens, certificates, connection strings, or production secrets."
  code-q03:
    correct: "Correct. Commands need impact review before approval."
    incorrect: "Unfamiliar commands may modify files, systems, dependencies, or data."
  code-q04:
    correct: "Correct. AI-written tests can help, but they need review against the intended behavior."
    incorrect: "Tests written by the same model can reflect the same assumptions as the code."
  code-q05:
    correct: "Correct. Git actions should remain controlled."
    incorrect: "Review diffs and get approval before Git or deployment actions."
  code-q06:
    correct: "Correct. Intent determines the level of engineering process needed."
    incorrect: "Shared or production-bound work needs stronger process than a local throwaway prototype."
  code-q07:
    correct: "Correct. Security-sensitive code still needs human review."
    incorrect: "Passing tests are not a full security review."
  code-q08:
    correct: "Correct. Claude Code reads CLAUDE.md, which can import AGENTS.md."
    incorrect: "Repository instructions should be concise, visible, and safe; do not rely on guessing or include secrets."
  code-q09:
    correct: "Correct. Start with root-cause analysis."
    incorrect: "Do not disable or delete tests before understanding the failure."
  code-q10:
    correct: "Correct. Use the approved Enterprise account and approved product surface."
    incorrect: "Do not move Sandvik work to private accounts, personal API keys, or unapproved tools."
  code-q11:
    correct: "Correct. Dependencies require policy, security, and license review."
    incorrect: "New dependencies can create security, maintenance, and license risk."
  code-q12:
    correct: "Correct. Review loops help catch assumptions and risks before release."
    incorrect: "Review loops support human accountability; they do not replace it."
